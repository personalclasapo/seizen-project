<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>建物の変更・登記｜表示v2</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../prototype/shared/tokens.css">
<link rel="stylesheet" href="../prototype/real-estate/area.css">
<!--
  建物の変更・登記｜今のうちの行の表示案 v1（2026-09-25）
  設計：設計/不動産・住まい/今のうち-そのとき_調査と項目.md §9

  ■ 事実の形
  建物が、いつ・誰の手で・どう変わったか（出来事）と、その結果、記録が
  今の建物とずれているか。相手は人ではなく記録（法務局の登記、市町村の
  課税台帳）。1件＝工事（変更）ごと。

  ■ 図
  家の形は描かない。どこを工事したかは家ごとに多すぎ、描けば位置の作り話に
  なる。登記と家族のすることを左右するのは、位置ではなく「どの記録に入って
  いるか」。行は3本（今の建物／登記／課税明細書）、段は本体と変更ごと。
    今の建物と同じ … 地の色
    今の建物と違う … 斜線（登記に入っていない増築、登記に残っている取り壊し）
    まだ見ていない … 破線と「?」
  登記と課税は一方向にしか連動しない（登記すれば課税台帳も直る：地方税法382条）。
  なので、登記に入っていれば課税の段も今の建物と同じに描く。
  図は、登記と今の建物がずれている（か分からない）変更があるときだけ。

  ■ 今のうちの線（§9-2）
  対応が必要 … 床面積が増えた変更（増築・別棟）が登記に入っていない・分からず、
                所有を示す工事の書類が2点そろっていない
  確認済み   … 書類がそろっている（家族が後から申請できる）／
                未登記なのが取り壊しだけ（所有を示す書類が要らない）／全部登記済み
-->
<style>
  body{margin:0;background:#F6F2EA;font-family:var(--font, "Noto Sans JP", sans-serif);color:var(--ink)}
  .page{max-width:1000px;margin:0 auto;padding:28px 20px 60px}
  .page h1{font-size:18px;margin:0 0 6px}
  .page .lead{font-size:12px;color:var(--ink2);margin:0 0 22px;line-height:1.8}
  .cases{display:grid;grid-template-columns:repeat(auto-fill,451px);gap:28px 24px;justify-content:center}
  .case h2{font-size:11.5px;font-weight:600;color:#7A6F59;margin:0 0 6px;line-height:1.6}
  .case h2 b{display:inline-block;min-width:22px;color:#3F3B34}
  .case .ans{font-size:10.5px;color:var(--ink3);margin:0 0 8px;line-height:1.6}
  /* 図：記録の比べ（今の建物／登記／課税明細書） */
  .cg-t{font-size:10px;fill:#6B6963}
  .cg-t.row{font-size:10px;fill:#5E584D}
  .cg-t.no{font-size:9.5px;fill:#6B6963;font-weight:600}
  .cg-t.q{font-size:10px;fill:#A39B8A}
  .cg-g{display:inline-block;width:12px;height:8px;margin-right:4px;vertical-align:middle;border:1.2px solid #6B6963}
  .cg-g.df{background:repeating-linear-gradient(135deg,#fff 0 2px,#8C877D 2px 3px)}
  .cg-g.uk{border-style:dashed;border-color:#A39B8A;background:repeating-linear-gradient(135deg,#fff 0 2px,#CFC8BA 2px 3px)}
  .cg-g.gn{border-style:dashed}
  .cg-fig .bd-item{grid-template-columns:1.3em minmax(0,1fr)}
  .cg-lg{white-space:nowrap;margin-right:10px}
  .cg-fig .bd-item span small{display:block;color:var(--ink3);font-size:10.5px;margin-top:1px}
</style>
</head>
<body>
<div class="page">
  <h1>建物の変更・登記｜今のうちの行 v2</h1>
  <p class="lead">答えの組み合わせごとに、行（一文 → 図＋右に短い説明 → 次にすること → くわしく）を並べた見本です。幅は本番の行と同じ 451px。くわしくは押すと開きます。<br>
  図は登記の図面（各階平面図＝真上から見た階ごとの形）に今の家を重ねたもの。実線＝登記に入っている、斜線＝登記に入っていない増築、破線＝取り壊したが登記に残っている。玄関を下にして描き、変更の場所は「玄関から見て 奥／右／左／玄関側」と「1階／2階」の答えから置きます（大きさは描かない）。</p>
  <div class="cases" id="cases"></div>
</div>
<script>
(function () {
  'use strict';
  const WHO = '父';
  const esc = s => String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');

  /* ── 答えの意味 ────────────────────────────────
     changed.has   … 建ててから形を変えたことがあるか yes／no／unasked／unknown（父も覚えていない）
     changed.check … 父が覚えていないとき、課税明細書で登記と比べた結果 diff／same／''（まだ）
     changed.changes[] … 変更ごと
       what  ext 増築（横・上に部屋を足した）／annex 別棟を建てた（離れ・車庫・物置）／
             cut 一部を取り壊した／demo 建物を取り壊した
       where どこを・どれくらい（任意。例：北側に約6畳）  when いつごろ（年・任意）
       reg   登記に入っているか yes／no／unknown
       tax   課税明細書は今の建物と合っているか（登記に入っていないときだけ）
             match 合っている（増築なら現況床面積に入っている）／miss 合っていない／''（まだ見ていない）
       docs  工事の書類（増える変更で、登記に入っていないときだけ）yes／no／unknown（まだ探していない）
       kinds 書類の種類 confirm 確認済証／inspect 検査済証／contract 工事の契約書／receipt 領収書／handover 工事完了引渡証明書
       by    工事を頼んだ会社（任意） */
  const GROW = w => w === 'ext' || w === 'annex';
  const KIND = { confirm: '確認済証', inspect: '検査済証', contract: '工事の契約書', receipt: '領収書', handover: '工事完了引渡証明書' };
  const circled = i => '①②③④⑤⑥'.charAt(i) || String(i + 1);

  function desc(c) {
    const w = c.where;
    const body = c.what === 'ext' ? (w ? w + 'を増築' : '増築')
      : c.what === 'annex' ? (w ? w + 'を建てた' : '別棟を建てた')
      : c.what === 'cut' ? (w ? w + 'を取り壊した' : '一部を取り壊した')
      : (w ? w + 'を取り壊した' : '建物を取り壊した');
    return (c.when ? c.when + '年ごろ、' : '') + body;
  }
  /* 登記の状態を言葉で。増える変更は「入っていない」、減る変更は「残っている」。 */
  function regText(c) {
    if (GROW(c.what)) return c.reg === 'yes' ? '登記済み' : c.reg === 'no' ? '登記に入っていない' : '登記に入っているか分からない';
    return c.reg === 'yes' ? '登記からも消えている' : c.reg === 'no' ? '登記に残っている' : '登記に残っているか分からない';
  }
  function taxText(c) {
    if (c.reg === 'yes') return '';
    if (GROW(c.what)) return c.tax === 'match' ? '課税はされている' : c.tax === 'miss' ? '課税もされていない' : '課税明細書はまだ見ていない';
    return c.tax === 'match' ? '課税は止まっている' : c.tax === 'miss' ? '課税はまだ続いている' : '課税明細書はまだ見ていない';
  }
  const docsOK = c => c.docs === 'yes' && (c.kinds || []).length >= 2;
  function docText(c) {
    if (c.docs === 'yes') return (c.kinds || []).map(k => KIND[k]).join('・') || '種類は記録なし';
    return c.docs === 'no' ? '見当たらない' : 'まだ探していない';
  }
  /* 変更1件の段：ok 登記済み／paper 未登記だが書類がそろう／later 未登記の取り壊し（書類が要らない）／act */
  function chState(c) {
    if (c.reg === 'yes') return 'ok';
    if (!GROW(c.what)) return 'later';
    return docsOK(c) ? 'paper' : 'act';
  }
  function status(m) {
    if (m.has === 'no') return { status: 'none', label: '' };
    if (m.has === 'unknown') return m.check === 'diff' ? { status: 'action', label: '' } : m.check === 'same' ? { status: 'none', label: '違いなし' } : { status: 'unknown', label: '' };
    if (m.has !== 'yes' || !(m.changes || []).length) return { status: 'unknown', label: '' };
    const st = m.changes.map(chState);
    if (st.includes('act')) return { status: 'action', label: '' };
    if (st.every(s => s === 'ok')) return { status: 'done', label: '登記済み' };
    return { status: 'done', label: st.includes('paper') ? '書類あり' : '' };
  }

  /* ══ 図｜登記の図面に今の家を重ねる（v2）
     参考：法務局の各階平面図の描き方（不動産登記規則83条）―― 壁芯を実線で、階ごとに別の図、
     上の階の図には1階の位置を点線で示す。附属建物は符号を付けて描き分ける。
     v1 の3本の帯（今の建物／登記／課税明細書）は、右の説明を描き直しただけで、何の絵でも
     なかった（2026-09-25「無理くり図にした感じ」）。登記そのものが家の図（各階平面図）を
     持っているので、ずれはその図の上に描ける。
     位置の多さは、登記が持つもの（各階の床面積と建物の数）まで畳む：何階か・玄関から見て
     どちら側か・本体に接しているか離れているか。大きさは描かない（見せるのは場所だけ）。
     向きは方角でなく玄関を下にする（境界と同じく、家族が答えられる向き）。
       side  back 奥／right 右／left 左／front 玄関側   floor 1／2（増築のとき） */
  function chFigure(uid, cs) {
    const two = cs.some(c => c.what === 'ext' && c.floor === 2);
    const W = 220, H = 128;
    const hatch = 'cg' + uid;
    const INK = '#6B6963';
    const reg = c => c.reg === 'yes' ? 'in' : c.reg === 'no' ? (GROW(c.what) ? 'out' : 'left') : 'unk';
    /* 1枚の平面。x,y,w,h＝本体。 */
    const plan = (X, Y, w, h, floor, label) => {
      let g = '';
      const mine = cs.map((c, i) => ({ c, i })).filter(({ c }) => (c.what === 'ext' ? (c.floor || 1) === floor : floor === 1));
      /* 変更の置き場所。辺ごとに並べる。 */
      const slots = { back: [], right: [], left: [], front: [] };
      mine.forEach(o => (slots[o.c.side || 'back'] || slots.back).push(o));
      const pieces = [];
      Object.keys(slots).forEach(side => {
        const list = slots[side], n = list.length;
        list.forEach((o, k) => {
          const c = o.c, apart = c.what === 'annex' || c.what === 'demo', gap = apart ? 8 : 0;
          const inside = c.what === 'ext' && floor === 2;     /* 2階の増築は1階の上に載る */
          const dep = apart ? 20 : 17;                         /* 本体から出る深さ */
          const hor = side === 'back' || side === 'front';
          const span = (hor ? w : h) / n, len = Math.min(span - 6, hor ? 40 : 30);
          const off = (hor ? X : Y) + span * k + (span - len) / 2;
          let r;
          if (inside) r = side === 'back' ? [X, Y, w, h * .42] : side === 'front' ? [X, Y + h * .58, w, h * .42]
            : side === 'left' ? [X, Y, w * .42, h] : [X + w * .58, Y, w * .42, h];
          else if (side === 'back') r = [off, Y - dep - gap, len, dep];
          else if (side === 'front') r = [off, Y + h + gap, len, dep];
          else if (side === 'left') r = [X - dep - gap, off, dep, len];
          else r = [X + w + gap, off, dep, len];
          pieces.push({ o, r, inside });
        });
      });
      /* 2階：1階の位置を点線、今ある2階（増築の部分を除く）を実線。 */
      if (floor === 2) {
        g += '<rect x="' + X + '" y="' + Y + '" width="' + w + '" height="' + h + '" fill="none" stroke="#A39B8A" stroke-width="1" stroke-dasharray="2 2"/>';
        const add = pieces.find(p => p.inside);
        const r = add ? add.r : null;
        const rest = !r ? [X, Y, w, h] : r[1] > Y ? [X, Y, w, r[1] - Y] : r[3] < h ? [X, Y + r[3], w, h - r[3]] : r[0] > X ? [X, Y, r[0] - X, h] : [X + r[2], Y, w - r[2], h];
        g += '<rect x="' + rest[0] + '" y="' + rest[1] + '" width="' + rest[2] + '" height="' + rest[3] + '" fill="#F4F1EA" stroke="' + INK + '" stroke-width="1.3"/>';
        label = '<tspan>' + label + '</tspan>'; X = rest[0]; Y = rest[1]; w = rest[2]; h = rest[3];
      } else {
        g += '<rect x="' + X + '" y="' + Y + '" width="' + w + '" height="' + h + '" fill="#F4F1EA" stroke="' + INK + '" stroke-width="1.3"/>';
        /* 玄関：下の辺の開口と印 */
        if (!slots.front.length) g += '<path d="M' + (X + w / 2 - 7) + ' ' + (Y + h) + 'h14" stroke="#F4F1EA" stroke-width="2.4"/><path d="M' + (X + w / 2) + ' ' + (Y + h + 3) + 'v7m-3-3 3 3 3-3" fill="none" stroke="#A39B8A" stroke-width="1"/>';
      }
      pieces.forEach(({ o, r }) => {
        const k = reg(o.c);
        const [x, y, ww, hh] = r;
        if (k === 'in') g += '<rect x="' + x + '" y="' + y + '" width="' + ww + '" height="' + hh + '" fill="#F4F1EA" stroke="' + INK + '" stroke-width="1.3"/>';
        else if (k === 'out') g += '<rect x="' + x + '" y="' + y + '" width="' + ww + '" height="' + hh + '" fill="url(#' + hatch + ')" stroke="' + INK + '" stroke-width="1.3"/>';
        else if (k === 'left') g += '<rect x="' + x + '" y="' + y + '" width="' + ww + '" height="' + hh + '" fill="none" stroke="' + INK + '" stroke-width="1.2" stroke-dasharray="4 2.5"/>';
        else g += '<rect x="' + x + '" y="' + y + '" width="' + ww + '" height="' + hh + '" fill="url(#' + hatch + 'l)" stroke="#A39B8A" stroke-width="1.2" stroke-dasharray="3 2"/>';
        /* 接している辺は本体の線を消す（増築は本体と一続きの建物）。 */
        g += '<text x="' + (x + ww / 2) + '" y="' + (y + hh / 2 + 3.6) + '" text-anchor="middle" class="cg-t no">' + circled(o.i) + (k === 'unk' ? '?' : '') + '</text>';
      });
      g += '<text x="' + (X + w / 2) + '" y="' + (Y + h / 2 + 3.6) + '" text-anchor="middle" class="cg-t">' + label + '</text>';
      return g;
    };
    let s = '<defs><pattern id="' + hatch + '" width="4" height="4" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="4" height="4" fill="#fff"/><path d="M0 0V4" stroke="#8C877D" stroke-width="1.3"/></pattern>' +
      '<pattern id="' + hatch + 'l" width="5" height="5" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="5" height="5" fill="#fff"/><path d="M0 0V5" stroke="#CFC8BA" stroke-width="1"/></pattern></defs>';
    if (two) {
      s += plan(34, 34, 60, 54, 1, '1階') + plan(150, 34, 60, 54, 2, '2階');
      s += '<text x="64" y="120" text-anchor="middle" class="cg-t q">玄関</text>';
    } else {
      s += plan(62, 30, 96, 62, 1, '本体');
      s += '<text x="110" y="120" text-anchor="middle" class="cg-t q">玄関</text>';
    }
    return '<svg viewBox="0 0 ' + W + ' ' + H + '" width="' + W + '" role="img" aria-label="登記の図面に、今の家を重ねた図（真上から、玄関が下）">' + s + '</svg>';
  }
  /* 図の右の説明。図を言葉で言う短い事実だけ。 */
  function chCaption(cs) {
    const items = cs.map((c, i) => {
      const lines = [regText(c), taxText(c)].filter(Boolean).join('。');
      const docs = GROW(c.what) && c.reg !== 'yes' ? '工事の書類：' + docText(c) : '';
      return '<div class="bd-item"><i>' + circled(i) + '</i><span>' + esc(desc(c)) + '<small>' + esc(lines) + (docs ? '<br>' + esc(docs) : '') + '</small></span></div>';
    });
    const has = f => cs.some(f);
    const legend = (has(c => c.reg === 'no' && GROW(c.what)) ? '<span class="cg-lg"><em class="cg-g df"></em>登記に入っていない</span> ' : '') +
      (has(c => c.reg === 'no' && !GROW(c.what)) ? '<span class="cg-lg"><em class="cg-g gn"></em>取り壊したが登記に残る</span> ' : '') +
      (has(c => c.reg === 'unknown') ? '<span class="cg-lg"><em class="cg-g uk"></em>登記は分からない</span>' : '');
    return '<div class="bd-cap"><div class="bd-items">' + items.join('') +
      (legend ? '<div class="bd-item"><i></i><span><small>' + legend + '</small></span></div>' : '') + '</div></div>';
  }

  const NEED = '増築・取り壊しの登記は所有者の<b>義務</b>です。登記が今の建物と違うままだと、<b>売る</b>とき買主のローンが通らないことがあります。';
  const act = rows => '<div class="pr-act"><div class="pr-act-h"><span>次にすること</span></div>' + rows.map(r =>
    '<p>' + (r.nb ? '<span class="bd-act-nb">' + esc(r.nb) + '</span>' : '') + esc(r.text) + (r.sub ? '<small>' + esc(r.sub) + '</small>' : '') + '</p>').join('') + '</div>';
  const openDt = new Set();
  function detail(key, sections) {
    const open = openDt.has(key);
    return '<div class="pr-dt' + (open ? ' open' : '') + '"><button type="button" class="pr-dt-t" data-dt="' + key + '" aria-expanded="' + open + '"><span class="pr-dt-k">くわしく</span><span class="pr-dt-s">' +
      sections.map(s => s[0]).join('・') + '</span><svg viewBox="0 0 12 8"><path d="m2 2 4 4 4-4" fill="none" stroke="currentColor" stroke-width="1.4"/></svg></button>' +
      (open ? '<div class="pr-dt-b">' + sections.map(([t, h], i) => '<section><h6><i>' + (i + 1) + '</i>' + t + '</h6><p>' + h + '</p></section>').join('') + '</div>' : '') + '</div>';
  }
  /* くわしく。場面ごと。どの節を出すかは答えで決める。 */
  const DT_SELL_GROW = ['売る・担保に入れるとき', '買主の金融機関は、担保にする建物の登記が今の建物と合っていることを求めます。登記に入っていない増築があると、ローンが通らない・減額されることがあります。'];
  const DT_SELL_GONE = ['売る・担保に入れるとき', '取り壊した建物が登記に残っていると、売る前に、取り壊しの登記（滅失登記）を求められます。'];
  const DT_PROOF = ['所有を示す書類', '増えた部分が' + WHO + 'のものだと示すには、確認済証・検査済証、工事の契約書と領収書、工事を頼んだ会社の工事完了引渡証明書、固定資産税の評価証明書などを使い、2点以上を求められることが多いです。' +
    '確認済証を無くしても、確認を受けていれば、役所で台帳記載事項証明書が取れることがあります。足りないときは、実印を押した上申書に印鑑証明書を付けて補います。'];
  const DT_TAX = ['課税されていなかったとき', '登記をすると法務局から市町村へ通知が行きます。課税されていなかった増築は、最大5年さかのぼって課税されることがあります。'];
  const DT_DUTY = ['義務と費用', '増築・取り壊しから1か月以内に申請する義務があり、怠ると10万円以下の過料の定めがあります。1か月を過ぎても義務は続き、今からでも申請できます。過料は、登記官から裁判所へ通知され、催告にも応じないときに検討されるものです。' +
    '土地家屋調査士の報酬の目安は、増築の登記で約10万円、取り壊しの登記で約5万円です（登録免許税はかかりません）。'];

  function body(key, p) {
    const m = p.changed;
    const quiet = t => '<p class="pr-quiet">' + t + '</p>';
    if (m.has === 'no') return quiet('建ててから、増築や取り壊しはしていません。');
    if (m.has === 'unasked') return '<p class="pr-why">' + NEED + '増築や取り壊しをしたか、どの会社に頼み、工事の書類がどこにあるかは、' + WHO + 'に聞かないと分かりません。</p>' +
      act([{ text: WHO + 'に、建ててから増築・取り壊し、離れや車庫を建てたことがあるか聞く', sub: 'あれば、いつごろ・どこを、どの会社に頼んだか、登記したか、工事の書類がどこにあるかも聞きます。' }]);
    if (m.has === 'unknown') {
      if (m.check === 'same') return quiet('課税明細書では、登記と課税の床面積に違いはありませんでした。市町村も把握していない増築があれば、これでは分からず、売るときの調査で見つかることがあります。そのときは、相続人全員の上申書で登記します。');
      if (m.check === 'diff') return '<p class="pr-why">' + NEED + '課税明細書で、登記に入っていない部分が見つかっています。今なら' + WHO + 'の名前で、' + WHO + 'の上申書を付けて申請できます。' + WHO + 'が亡くなった後は、相続人全員が実印を押した上申書が要ります。</p>' +
        act([{ text: '土地家屋調査士に課税明細書を見せ、' + WHO + 'の名前で表題変更登記を頼む', sub: '工事の書類が無くても、固定資産評価証明書と' + WHO + 'の上申書で示せます。' }]) +
        detail(key, [DT_SELL_GROW, DT_PROOF, DT_DUTY]);
      return '<p class="pr-why">' + NEED + WHO + 'が覚えていなくても、市町村が把握している増築は、課税明細書で分かります。</p>' +
        act([{ text: '課税明細書の家屋の欄で、登記床面積と現況床面積を比べる', sub: '現況床面積のほうが大きい、または家屋番号の欄が「未登記家屋」の行があれば、登記に入っていない部分があります。課税明細書は、固定資産税の納税通知書に同封されています。' }]);
    }
    const cs = m.changes || [];
    const st = cs.map(chState);
    if (st.every(s => s === 'ok')) return quiet('建ててからの変更（' + cs.map(desc).join('／') + '）は、すべて登記に入っています。');
    const fig = '<div class="bd-fig cg-fig"><div class="bd-figs">' + chFigure(key, cs) + '</div>' + chCaption(cs) + '</div>';
    const grow = cs.filter(c => GROW(c.what) && c.reg !== 'yes');
    const gone = cs.filter(c => !GROW(c.what) && c.reg !== 'yes');
    const sections = [];
    if (grow.length) sections.push(DT_SELL_GROW); else if (gone.length) sections.push(DT_SELL_GONE);
    if (st.includes('act')) sections.push(DT_PROOF);
    if (grow.some(c => c.tax !== 'match')) sections.push(DT_TAX);
    sections.push(DT_DUTY);
    if (st.includes('act')) {
      const acts = cs.map((c, i) => ({ c, i })).filter(x => chState(x.c) === 'act');
      /* 一文：今のうちの理由は、いちばん手がかりの少ない変更で言う。 */
      const bare = acts.find(x => x.c.docs === 'no' && x.c.tax === 'miss');
      const hunt = acts.every(x => x.c.docs === 'unknown');
      const why = hunt
        ? '工事の書類（確認済証・契約書・領収書など）がそろっていれば、家族も後から申請できます。どこに仕舞ったかは' + WHO + 'に聞かないと分かりません。'
        : (bare ? '課税明細書にも入っておらず、増築したことを示すものは' + WHO + 'の記憶だけです。' : '') +
          '工事の書類が足りなくても、今なら' + WHO + 'の名前で、' + WHO + 'の上申書を付けて申請できます。' + WHO + 'が亡くなった後は、相続人全員が実印を押した上申書が要ります。';
      const rows = acts.map(({ c, i }) => {
        const nb = cs.length > 1 ? circled(i) : '';
        if (c.docs === 'unknown') return { nb, text: '工事の書類を探す', sub: '確認済証・検査済証、工事の契約書・領収書など。仕舞った場所は' + WHO + 'に聞きます。' };
        const firm = c.by || '工事を頼んだ会社';
        const what = c.what === 'ext' ? '表題変更登記' : '登記';
        const sub = (c.reg === 'unknown' ? '登記に入っているかは、調査士が登記事項証明書で確かめます。' : '') +
          (c.tax === 'match' ? '課税されているので、固定資産評価証明書も示す書類に使えます。' : '') +
          (c.docs === 'yes' ? 'いまある' + docText(c) + 'のほかに、' + firm + 'の工事完了引渡証明書などをもう1点添えます。'
            : firm + 'に工事完了引渡証明書を頼めるかを調査士と確かめ、足りない分は' + WHO + 'の上申書で補います。');
        return { nb, text: '土地家屋調査士に、' + WHO + 'の名前で' + what + 'を頼む', sub };
      });
      return '<p class="pr-why">' + NEED + why + '</p>' + fig + act(rows) + detail(key, sections);
    }
    /* 対応は残っていない（書類がそろっている／未登記は取り壊しだけ）。登記は家族が後からできる。 */
    const why = (grow.length && gone.length ? '増築は工事の書類がそろっていて、取り壊しの登記は所有を示す書類が要らないので、'
      : grow.length ? '工事の書類がそろっているので、' : '取り壊しの登記は所有を示す書類が要らず、') +
      WHO + 'が亡くなった後も、家族が申請できます。登記は所有者の<b>義務</b>で、<b>売る</b>・担保に入れる前には必要です。';
    return '<p class="pr-why">' + why + '</p>' + fig + detail(key, sections);
  }

  /* ── 組み合わせ ───────────────────────────── */
  const CASES = [
    ['まだ聞いていない', { has: 'unasked' }],
    ['変えていない', { has: 'no' }],
    ['父も覚えていない／課税明細書はまだ見ていない', { has: 'unknown', check: '' }],
    ['父も覚えていない／課税明細書で違いなし', { has: 'unknown', check: 'same' }],
    ['父も覚えていない／課税明細書で違いあり', { has: 'unknown', check: 'diff' }],
    ['増築1件・未登記・課税あり・書類はまだ探していない（自宅の旧データの読み替え）',
      { has: 'yes', changes: [{ what: 'ext', where: '北側に約6畳', side: 'back', floor: 1, when: '2015', reg: 'no', tax: 'match', docs: 'unknown', kinds: [], by: '' }] }],
    ['増築1件・未登記・課税あり・書類は見当たらない・会社は分かる',
      { has: 'yes', changes: [{ what: 'ext', where: '北側に約6畳', side: 'back', floor: 1, when: '2015', reg: 'no', tax: 'match', docs: 'no', kinds: [], by: '◯◯工務店' }] }],
    ['増築1件・未登記・課税もされていない・書類は見当たらない（父の記憶だけ）',
      { has: 'yes', changes: [{ what: 'ext', where: '南側に約4畳', side: 'front', floor: 1, when: '2010', reg: 'no', tax: 'miss', docs: 'no', kinds: [], by: '' }] }],
    ['増築1件・登記は分からない・課税明細書はまだ・領収書だけある',
      { has: 'yes', changes: [{ what: 'ext', where: '北側に約6畳', side: 'back', floor: 1, when: '2015', reg: 'unknown', tax: '', docs: 'yes', kinds: ['receipt'], by: '◯◯工務店' }] }],
    ['増築1件・未登記・課税あり・確認済証と検査済証がある',
      { has: 'yes', changes: [{ what: 'ext', where: '北側に約6畳', side: 'back', floor: 1, when: '2015', reg: 'no', tax: 'match', docs: 'yes', kinds: ['confirm', 'inspect'], by: '' }] }],
    ['増築（登記済み）＋物置の取り壊し（登記に残る・課税は止まっている）',
      { has: 'yes', changes: [{ what: 'ext', where: '2階に1部屋', side: 'right', floor: 2, when: '2008', reg: 'yes' }, { what: 'demo', where: '物置', side: 'left', when: '2019', reg: 'no', tax: 'match' }] }],
    ['増築（登記済み）＋車庫（未登記・課税あり・書類は見当たらない）',
      { has: 'yes', changes: [{ what: 'ext', where: '2階に1部屋', side: 'right', floor: 2, when: '2008', reg: 'yes' }, { what: 'annex', where: '車庫', side: 'right', when: '2012', reg: 'no', tax: 'match', docs: 'no', kinds: [], by: '' }] }],
    ['増築（未登記・書類がそろう）＋離れの取り壊し（登記に残る・課税明細書はまだ）',
      { has: 'yes', changes: [{ what: 'ext', where: '庭側に約4畳', side: 'left', floor: 1, when: '2016', reg: 'no', tax: 'match', docs: 'yes', kinds: ['contract', 'receipt'] }, { what: 'demo', where: '離れ', side: 'back', when: '2020', reg: 'no', tax: '' }] }],
    ['全部登記済み',
      { has: 'yes', changes: [{ what: 'ext', where: '北側に約6畳', when: '2015', reg: 'yes' }] }]
  ];
  const ICON = '<svg class="matter-icon" viewBox="0 0 44 48" fill="none" aria-hidden="true"><path d="M6 10h22v29H6z" fill="#F0EADD" stroke="#9C8C70"/><path d="M28 20h12v19H28" fill="#E4ECDC" stroke="#718B64" stroke-dasharray="3 2"/><path d="M6 25h13m0-15v15m15 1v7m-3-3.5h6" stroke="#9C8C70"/><path d="M10 14h5m-5 4h5" stroke="#C4B9A3"/></svg>';
  const TONE = { action: 'or', unknown: 'bl', done: 'gr', none: 'gy' };
  const LABEL = { action: '対応が必要', unknown: '未確認', done: '確認済み', none: '該当なし' };
  function draw() {
    document.getElementById('cases').innerHTML = CASES.map(([t, m], i) => {
      const s = status(m), key = 'c' + i;
      return '<div class="case"><h2><b>' + (i + 1) + '</b>' + esc(t) + '</h2><div class="rail"><section class="rw is-' + s.status + '"><div class="rh">' + ICON +
        '<div class="uh"><div class="uh-t"><span class="uh-nm">建物の変更・登記</span></div><div class="uh-r"><button type="button" class="bdg status-pick ' + TONE[s.status] + '">' +
        esc(s.label || LABEL[s.status]) + '<svg class="caret" viewBox="0 0 12 8"><path d="m2 2 4 4 4-4" fill="none" stroke="currentColor" stroke-width="1.4"/></svg></button></div></div></div>' +
        body(key, { changed: m }) + '</section></div></div>';
    }).join('');
  }
  document.addEventListener('click', e => {
    const b = e.target.closest('[data-dt]'); if (!b) return;
    const k = b.dataset.dt; openDt.has(k) ? openDt.delete(k) : openDt.add(k); draw();
  });
  draw();
})();
</script>
</body>
</html>
