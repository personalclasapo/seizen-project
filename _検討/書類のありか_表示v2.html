<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>書類のありか 表示v2</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../prototype/shared/tokens.css">
<link rel="stylesheet" href="../prototype/real-estate/area.css">
<!--
  書類のありか 見本 v2（2026-09-28）

  v1 は部屋を「書類ごとの説明の場所」にした誤り（なぜ要るか・くわしく・紙の絵）。
  説明は紙を使う側の行（今のうち・そのとき）が持っている。ここは、このページの
  区分が「書面がある」と言った紙を集めて、どこにあるかを示す一覧。

  区分    … 紙が生まれた区分（有無を答えた区分）で分ける：今のうち／権利関係／ローン・契約。
             そのときは紙を使う側なので見出しにせず、各行の「使うとき」に出す
             （使う側でも分けると、協議書・工事の書類が2か所に出る）。
  行      … 束ごと（隣ごと・相手ごと・工事ごと）。紙の種類は名前に並べ、場所は1つ。
  1行     … 何の紙か／使うとき／場所。状態は「場所が分かる／場所がまだ」の2つだけ
             （出るのは書面ありと答えた紙だけなので、無い・見つからないは起きない）。
  権利関係 … 権利証・取得時の資料を権利関係に持たせる（名義を得たときに手元に来る紙）。
             権利関係の行で「ある」と答えたものだけがここに出る。
-->
<style>
  body{margin:0;background:var(--page);font-family:var(--font);color:var(--ink)}
  .wrap{max-width:1500px;margin:0 auto;padding:32px 24px 80px}
  h1{font-size:18px;margin:0 0 6px}
  .lead{font-size:12.5px;color:var(--ink2);line-height:1.8;margin:0 0 24px;max-width:860px}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(451px,100%),451px));justify-content:start;gap:28px 40px;align-items:start}
  .case > h2{font-size:11.5px;font-weight:600;color:#4b5f50;margin:0 0 8px;line-height:1.6}
  .case > h2 small{display:block;font-weight:400;color:var(--ink3);font-size:10.5px}
  .room{box-sizing:border-box;background:#FDFCF8;border:6px solid #E6E1D4;padding:16px 18px 14px}

  /* 区分の見出し */
  .grp-l{margin:12px 0 0;padding-top:12px;border-top:1px solid #EAE4D6;font-size:11px;font-weight:700;color:var(--ink2);letter-spacing:.04em}
  .rm-h + .grp-l{margin-top:4px;padding-top:0;border-top:0}
  /* 1行＝1束 */
  .dr{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:0 10px;padding:9px 0}
  .dr + .dr{border-top:1px dashed #E7E1D2}
  .dr-k{font-size:10.5px;color:var(--ink3);line-height:1.5}
  .dr-n{font-size:13px;font-weight:650;line-height:1.55;margin-top:1px}
  .dr-u{grid-column:1/-1;font-size:10.5px;color:var(--ink2);line-height:1.65;margin-top:2px}
  .dr-u i{font-style:normal;color:var(--ink3);margin-right:5px}
  .dr-at{grid-column:1/-1;margin-top:5px;font-size:13px;font-weight:600;line-height:1.55;color:#2F4A37}
  .dr-at .kind{display:inline-block;margin-right:6px;padding:0 6px;border:1px solid #CFD9CC;border-radius:3px;
    font-size:10px;font-weight:600;color:#4F7358;vertical-align:1px}
  .dr-at.no{font-size:11.5px;font-weight:600;color:#8f6227}
  .dr .uh-r{margin:-4px 0 0;align-self:start}
  .empty{margin:6px 0 4px;font-size:11.5px;color:var(--ink2);line-height:1.8}

  /* フォームの見本 */
  .fm{margin-top:44px}
  .fm > h2{font-size:14px;margin:0 0 4px}
  .fm > p{font-size:12px;color:var(--ink2);margin:0 0 14px;line-height:1.8}
  .fm .re-dialog{position:static;display:block;max-height:none;width:min(700px,100%);border:1px solid #DDD7C8;border-radius:12px;background:#fff;box-shadow:0 8px 28px #2b35291a}
  .fm .re-dialog form{max-height:none}
  .fm .re-dialog-body{overflow:visible}
  .re-place{display:grid;gap:10px}
  .re-place input{box-sizing:border-box;width:min(420px,100%);border:1px solid #cccfc0;border-radius:6px;padding:10px 11px;font:14px/1.6 var(--font)}
</style>
</head>
<body>
<div class="wrap">
  <h1>書類のありか v2</h1>
  <p class="lead">このページの区分が「書面がある」と言った紙を集めて、どこにあるかを示す一覧。見出しは紙が生まれた区分（今のうち／権利関係／ローン・契約）。
    そのときは紙を使う側なので、各行の「使うとき」に出す。1行＝束（隣ごと・相手ごと・工事ごと）で、何の紙か・使うとき・場所だけ。</p>
  <div class="grid" id="grid"></div>

  <div class="fm">
    <h2>フォーム（場所だけ）</h2>
    <p>紙があるかどうかは、その紙が生まれた区分で答えている。ここで聞くのは場所だけ。</p>
    <div id="form"></div>
  </div>
</div>

<script>
const PEN = '<svg class="re-pen" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 13l.6-2.9L10.8 2.9a1.2 1.2 0 0 1 1.7 0l.6.6a1.2 1.2 0 0 1 0 1.7L5.9 12.4Z"/><path d="M9.6 4.1l2.3 2.3M3 13h10"/></svg>';
const DOCIC = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M6.5 3.5H14l4 4v12.4a.6.6 0 0 1-.6.6H6.5a.6.6 0 0 1-.6-.6V4.1a.6.6 0 0 1 .6-.6Z"/><path d="M14 3.5V8h4"/><path d="M9 12h6M9 15.5h6"/></svg>';
const edit = '<div class="uh-r"><button type="button" class="record-edit">' + PEN + '<span>記録</span></button></div>';
const KIND = { home: '', safe: '貸金庫', kept: '預けている' };

/* 1行＝1束。k＝どの項目の紙か、n＝紙の名前、use＝使うとき、at＝場所（無ければ「場所がまだ」） */
const row = r => '<div class="dr"><div><div class="dr-k">' + r.k + '</div><div class="dr-n">' + r.n + '</div></div>' + edit +
  '<div class="dr-u"><i>使うとき</i>' + r.use + '</div>' +
  (r.at ? '<div class="dr-at">' + (KIND[r.at.kind] ? '<span class="kind">' + KIND[r.at.kind] + '</span>' : '') + r.at.t + '</div>'
        : '<div class="dr-at no">場所はまだ記録されていません</div>') + '</div>';
const grp = (label, rows) => rows.length ? '<p class="grp-l">' + label + '</p>' + rows.map(row).join('') : '';
const room = groups => '<div class="room"><div class="rm-h"><span class="rm-ic">' + DOCIC + '</span><h4>書類のありか</h4></div>' +
  (groups.join('') || '<p class="empty">書面があると答えた紙は、まだありません。権利証があるかどうかは「権利関係」で確かめます。</p>') + '</div>';

const CAB = { kind: 'home', t: '書斎のキャビネット上段' };
const jitakuRights = [
  { k: '建物', n: '権利証（登記済証）', use: '父が売る・担保に入れるとき', at: CAB },
  { k: '土地（祖父の名義）', n: '祖父の権利証（登記済証）', use: 'そのとき｜相続登記（祖父の登記の住所がつながらないとき）', at: CAB },
  { k: '建物', n: '建てたときの工事請負契約書・領収書', use: '売ったときの税の申告', at: CAB }
];

const CASES = [
  { h: '自宅｜今の答え', s: '今のうちで書面ありの答えはない（境界は口頭・工事の書類はまだ探していない・前の代は協議書なし）',
    body: room([grp('今のうち', []), grp('権利関係', jitakuRights), grp('ローン・契約', [])]) },

  { h: '自宅｜協議書に全員が署名し、増築の工事の書類が見つかったあと', s: '今のうちから2束が出る。工事の書類は場所がまだ',
    body: room([
      grp('今のうち', [
        { k: '前の代の相続登記', n: '祖父の遺産分割協議書・印鑑証明書', use: 'そのとき｜相続登記', at: { kind: 'safe', t: '○○銀行 青葉台支店の貸金庫' } },
        { k: '建物の変更｜北側の増築（2015年）', n: '確認済証・工事請負契約書', use: '今のうち｜建物の変更（表題変更登記）、そのとき｜相続登記' }]),
      grp('権利関係', jitakuRights), grp('ローン・契約', [])]) },

  { h: '長岡の家｜今の答え', s: '私道の取り決めは口頭・権利証はまだ確かめていない',
    body: room([grp('今のうち', []), grp('権利関係', []), grp('ローン・契約', [])]) },

  { h: '長岡の家｜書面がそろっているとき', s: '境界確認書・私道の覚書・権利証・駐車場を貸している契約書',
    body: room([
      grp('今のうち', [
        { k: '境界・越境｜右隣 ○○さん', n: '境界確認書・測量図', use: '土地を売る・分けるとき、隣が測量するとき', at: { kind: 'home', t: '長岡の家 仏間の箪笥の上の引き出し' } },
        { k: '私道・通行・配管｜向かいの3軒', n: '私道の舗装の覚書', use: '私道を直すとき・売るとき', at: { kind: 'home', t: '長岡の家 仏間の箪笥の上の引き出し' } }]),
      grp('権利関係', [
        { k: '土地・建物', n: '権利証（登記済証・1冊）', use: '父が売る・担保に入れるとき', at: { kind: 'safe', t: '○○銀行 青葉台支店の貸金庫' } }]),
      grp('ローン・契約', [
        { k: '貸している｜△△さん（駐車場）', n: '賃貸借契約書', use: 'そのとき｜貸している契約', at: CAB }])]) }
];

document.getElementById('grid').innerHTML = CASES.map(c =>
  '<div class="case"><h2>' + c.h + '<small>' + c.s + '</small></h2>' + c.body + '</div>').join('');

/* フォーム：場所だけ */
const opts = (xs, on) => '<div class="re-opts pill">' + xs.map(([v, l]) => '<label class="re-opt"><input type="radio" name="k" value="' + v + '"' + (v === on ? ' checked' : '') + '><span><b>' + l + '</b></span></label>').join('') + '</div>';
document.getElementById('form').innerHTML = '<div class="re-dialog"><form><header class="re-dialog-head"><div><p class="re-eyebrow">自宅 ／ 確認と記録</p><h2>祖父の遺産分割協議書・印鑑証明書</h2></div><button type="button" class="re-close" aria-label="閉じる">×</button></header>' +
  '<div class="re-dialog-body"><div class="re-q"><p class="re-q-t">どこにありますか</p><div class="re-place">' +
  opts([['home', '家の中'], ['safe', '貸金庫'], ['kept', '預けている']], 'safe') +
  '<input type="text" value="○○銀行 青葉台支店の貸金庫" aria-label="場所"></div>' +
  '<p class="re-q-h">預けているときは、相手の名前を書きます。貸金庫は、父が亡くなると開けるのに相続人全員の同意が要ります。</p></div></div>' +
  '<footer class="re-dialog-foot"><span>分かったところまで残せます</span><button type="button">キャンセル</button><button class="re-save" type="button">記録を保存</button></footer></form></div>';
</script>
</body>
</html>
