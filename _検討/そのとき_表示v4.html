<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>そのとき 相続登記 表示v4</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../prototype/shared/tokens.css">
<link rel="stylesheet" href="../prototype/real-estate/area.css">
<!--
  そのとき｜相続登記のカード 見本 v4（2026-09-27）

  v3 からの変更：
  ・そろえる書類の点線をやめ、紙はすべて実線（凡例なしでは読めず、
    「作る」と「場所が分からない」の2つの意味を兼ねていた。状態は
    見出しと「場所は分からない」の字が言う）
  ・そろえる書類の下に「権利証は要らない」を1行（家族がまず探すもの）
  ・一文の話し合いは「父の遺言がなければ」を頭に付ける
  ・「手順・補足」→ 今のうちと同じ「くわしく＋中身の見出し」。中は場面ごと：
      遺言が見つかったとき／間に合わないとき／費用／自分で申請するとき
    手順は表の「順番」「そろえる書類」が持つので、中には置かない。
    間に合わないときは、今のうちの前の代の「くわしく」と同じ事実
    （相続人申告登記と法定相続分での登記の2つ）を同じ形で出す。
-->
<style>
  body{margin:0;background:var(--page);font-family:var(--font);color:var(--ink)}
  .wrap{max-width:1500px;margin:0 auto;padding:32px 24px 80px}
  h1{font-size:18px;margin:0 0 6px}
  .lead{font-size:12.5px;color:var(--ink2);line-height:1.8;margin:0 0 24px;max-width:780px}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(451px,1fr));gap:28px 24px;align-items:start}
  .case{background:#E9EFE9;padding:14px 14px 16px;border-radius:4px}
  .case > h2{font-size:11.5px;font-weight:600;color:#4b5f50;margin:0 0 10px;line-height:1.6}
  .case > h2 small{display:block;font-weight:400;color:var(--ink3);font-size:10.5px}
  .case .procedure-sheet{max-width:423px}

  /* ── 見本で足すもの ─────────────────────────────── */
  .sw-sec{margin:14px 0 0;padding-top:12px;border-top:1px solid #e8eee7}
  .sw-lb{font-size:10.5px;color:#5c7562;letter-spacing:.02em;margin:0 0 8px}

  /* この家の事情＝一文（今のうちの .rw-record p と同じ字）。 */
  .sw-say{margin:12px 0 0;font-size:12.25px;line-height:1.85;color:#3F3B34}
  .sw-say b{font-weight:600;color:var(--ink)}
  /* ① 名義の移り（v3 では使わない） */
  .nm-fig{display:block;width:100%;height:auto;overflow:visible}
  .nm-fig text{font-family:var(--font)}
  .nm-key{display:flex;align-items:center;gap:6px;margin:6px 0 0;font-size:10.5px;color:var(--ink2);line-height:1.6}
  .nm-key svg{flex:none}
  .nm-ppl{margin:8px 0 0;font-size:11.5px;line-height:1.7;color:var(--ink2)}
  .nm-ppl b{color:var(--ink);font-weight:600}

  /* ② そろえる書類 */
  .dk{display:grid;grid-template-columns:5.2em minmax(0,1fr);gap:10px 10px;align-items:start}
  .dk-h{font-size:10.5px;color:var(--ink2);line-height:1.5;padding-top:4px}
  .dk-h small{display:block;color:var(--ink3);font-size:9.5px}
  .dk-row{display:flex;flex-wrap:wrap;gap:10px 12px}
  .dk-doc{display:grid;grid-template-columns:auto minmax(0,1fr);gap:0 7px;align-items:start;max-width:100%}
  .dk-doc svg{display:block;flex:none;overflow:visible}
  .dk-t{font-size:12px;font-weight:600;line-height:1.45;color:var(--ink)}
  .dk-s{display:block;font-size:10.5px;font-weight:400;color:var(--ink2);line-height:1.55}
  .dk-at{display:block;font-size:10.5px;font-weight:600;color:#355640;line-height:1.55}
  .dk-no{color:#8f6227}
  .dk-row.big .dk-doc{flex:1 1 100%}
  /* 役所で取るもの：どの家でも同じ。名前だけ小さく並べる。 */
  .dk-row.small{gap:6px 12px}
  .dk-row.small .dk-t{font-size:11.5px;font-weight:500}

  .dk-not{margin:10px 0 0;font-size:11px;color:var(--ink2);line-height:1.7}
  .dk-not b{color:var(--ink);font-weight:600}
  /* くわしく：今のうちの .pr-dt と同じ。カードの下端に付ける。 */
  .procedure-sheet .pr-dt{margin:14px -18px 0}
  .pr-dt-b p{margin:0 0 6px;font-size:11.5px;line-height:1.8;color:#514B42}
  .pr-dt-b a{color:#42674e;font-size:11px}
  /* 順番（2段あるときだけ） */
  .sq{display:flex;align-items:stretch;gap:6px;flex-wrap:wrap}
  .sq-step{flex:1 1 0;min-width:0;border:1px solid #dfe6dd;border-radius:6px;padding:7px 9px}
  .sq-step b{display:block;font-size:12px;line-height:1.5}
  .sq-step small{display:block;font-size:10.5px;color:#5c7562}
  .sq-ar{align-self:center;color:#9B988E;font-size:13px}
  .one{font-size:11.5px;color:var(--ink2);line-height:1.7;margin:0}
  .one b{color:var(--ink);font-weight:600}
</style>
</head>
<body>
<div class="wrap">
  <h1>そのとき｜相続登記のカード v4</h1>
  <p class="lead">v3 に、点線の廃止・権利証の1行・「父の遺言がなければ」・「くわしく」（場面ごと）を反映。
    C だけ「くわしく」を開いた状態。</p>
  <div class="grid" id="grid"></div>
</div>

<script>
const NS = 'http://www.w3.org/2000/svg';
const TOKI = '<svg class="gi" viewBox="0 0 30 42.4" width="25" height="35.3" aria-hidden="true">' +
  '<rect x="1.4" y="1" width="24" height="36" rx="1" fill="#FFFFFF" stroke="#BDB5A0" stroke-width=".9"/>' +
  '<rect x="4.2" y="5.4" width="13" height="2.4" rx=".5" fill="#BFB49A"/>' +
  '<line x1="4.2" y1="11.4" x2="22.6" y2="11.4" stroke="#DDD7C7" stroke-width=".9"/><line x1="4.2" y1="15.4" x2="22.6" y2="15.4" stroke="#DDD7C7" stroke-width=".9"/>' +
  '<rect x="4.2" y="23" width="18.4" height="8.4" rx=".6" fill="#E4E0D4" stroke="#C4BCA6" stroke-width=".8"/>' +
  '<rect x="18" y="30.4" width="5.6" height="5.6" rx=".6" fill="none" stroke="#C0574E" stroke-width="1" opacity=".85"/></svg>';
const CAL = '<svg viewBox="0 0 14 14" width="14" height="14"><rect x=".7" y="2.4" width="12.6" height="11" rx="1.4" fill="none" stroke="#B9B2A0" stroke-width="1.1"/><line x1=".7" y1="5.8" x2="13.3" y2="5.8" stroke="#B9B2A0" stroke-width="1.1"/><line x1="4.2" y1=".7" x2="4.2" y2="3.5" stroke="#B9B2A0" stroke-width="1.3" stroke-linecap="round"/><line x1="9.8" y1=".7" x2="9.8" y2="3.5" stroke="#B9B2A0" stroke-width="1.3" stroke-linecap="round"/></svg>';

/* ── ① 名義の移り ──────────────────────────────────
   lanes: [{ lb:'土地', nodes:['祖父一郎','父','家族'], hatch:false, note:'' }]
   列は3つ（前の代／父／家族）で固定し、筋ごとに始まる列が違う。
   hops: 括弧 [{ from:0|1, to:1|2, t:'…' }] を筋の下に。 */
function nameFig(f) {
  /* 列の数は一番長い筋に合わせる。前の代の名義が無い家は2列で幅いっぱいに
     使う（3列のままだと左に空きの列が残り、図が右に寄った）。 */
  const lanes = f.lanes, hops = f.hops || [];
  const NC = Math.max.apply(null, lanes.map(l => l.nodes.length)), off = 3 - NC;
  const W = 387, LB = 34, GAP = 30, NH = 30, LH = 40, NW = (W - LB - GAP * (NC - 1)) / NC;
  const cx = i => LB + (i - off) * (NW + GAP);
  const H = lanes.length * LH - (LH - NH) + (hops.length ? 34 : 0);
  let s = '<svg class="nm-fig" viewBox="0 0 ' + W + ' ' + H + '" xmlns="' + NS + '" role="img" aria-label="名義の移り">' +
    '<defs><pattern id="hz" width="5" height="5" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">' +
    '<line x1="0" y1="0" x2="0" y2="5" stroke="#8E877A" stroke-width="1"/></pattern>' +
    '<marker id="ar" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto">' +
    '<path d="M1 1 7 4 1 7" fill="none" stroke="#8E877A" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>';
  lanes.forEach((ln, li) => {
    const y = li * LH;
    s += '<text x="0" y="' + (y + NH / 2 + 4) + '" font-size="11" fill="#6B6963">' + ln.lb + '</text>';
    const start = 3 - ln.nodes.length;
    ln.nodes.forEach((nm, k) => {
      const col = start + k, x = cx(col), last = k === ln.nodes.length - 1;
      /* 移る先（家族）は破線＝まだ移っていない。今の名義は実線。 */
      s += '<rect x="' + x + '" y="' + y + '" width="' + NW + '" height="' + NH + '" rx="4" fill="' + (last ? '#FFFFFF' : '#F4F2EC') +
        '" stroke="' + (last ? '#A9A294' : '#8E877A') + '" stroke-width="1.1"' + (last ? ' stroke-dasharray="3 2.5"' : '') + '/>';
      /* 登記に載っていない増築＝札の右端の斜線（今のうちの建物の図と同じ約束）。 */
      if (ln.hatch && k === 0) s += '<rect x="' + (x + NW - 22) + '" y="' + (y + 1) + '" width="21" height="' + (NH - 2) + '" fill="url(#hz)" opacity=".75"/>' +
        '<line x1="' + (x + NW - 22) + '" y1="' + y + '" x2="' + (x + NW - 22) + '" y2="' + (y + NH) + '" stroke="#8E877A" stroke-width="1"/>';
      s += '<text x="' + (x + (ln.hatch && k === 0 ? (NW - 22) / 2 : NW / 2)) + '" y="' + (y + NH / 2 + 4.5) + '" font-size="12" font-weight="' + (last ? 500 : 600) +
        '" text-anchor="middle" fill="' + (last ? '#6B6963' : '#32322E') + '">' + nm + '</text>';
      if (!last) s += '<line x1="' + (x + NW + 3) + '" y1="' + (y + NH / 2) + '" x2="' + (x + NW + GAP - 4) + '" y2="' + (y + NH / 2) + '" stroke="#8E877A" stroke-width="1.2" marker-end="url(#ar)"/>';
    });
  });
  /* 括弧：各段を何で移すか。 */
  const by = lanes.length * LH - (LH - NH) + 8;
  hops.forEach(h => {
    const x1 = cx(h.from) + NW / 2, x2 = cx(h.to) + NW / 2;
    s += '<path d="M' + x1 + ' ' + by + 'v5H' + x2 + 'v-5" fill="none" stroke="#A9A294" stroke-width="1"/>' +
      '<text x="' + ((x1 + x2) / 2) + '" y="' + (by + 20) + '" font-size="10.5" text-anchor="middle" fill="#6B6963">' + h.t + '</text>';
  });
  return s + '</svg>' + (lanes.some(l => l.hatch)
    ? '<p class="nm-key"><svg width="16" height="11" aria-hidden="true"><defs><pattern id="hzk" width="4" height="4" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="4" stroke="#8E877A" stroke-width="1"/></pattern></defs><rect x=".5" y=".5" width="15" height="10" fill="url(#hzk)" stroke="#8E877A"/></svg>登記に載っていない増築。相続登記の前に、表題変更登記で載せる</p>' : '');
}

/* ── ② そろえる書類 ───────────────────────────────
   書面は A4 1:1.414。solid＝ある・取れる、dash＝まだ無い。 */
function paper(dash, w) {
  w = w || 20; const h = (w * 1.414).toFixed(1);
  return '<svg width="' + w + '" height="' + h + '" viewBox="0 0 20 28.3" aria-hidden="true">' +
    '<rect x=".6" y=".6" width="18.8" height="27.1" rx=".8" fill="' + (dash ? '#FFFFFF' : '#FBFAF6') + '" stroke="' + (dash ? '#A9A294' : '#9C9584') +
    '" stroke-width="1"' + (dash ? ' stroke-dasharray="2.4 2"' : '') + '/>' +
    (dash ? '' : '<path d="M4 6h8M4 10h12M4 13.5h12M4 17h8" stroke="#D6D0C1" stroke-width="1" stroke-linecap="round"/>') + '</svg>';
}
function docs(d) {
  const item = x => '<div class="dk-doc">' + paper(false, x.small ? 14 : 20) +
    '<div class="dk-t">' + x.t + (x.s ? '<span class="dk-s">' + x.s + '</span>' : '') +
    (x.at ? '<span class="dk-at">' + x.at + '</span>' : '') +
    (x.no ? '<span class="dk-at dk-no">' + x.no + '</span>' : '') + '</div></div>';
  const grp = (h, sub, xs, cls) => xs && xs.length
    ? '<div class="dk-h">' + h + (sub ? '<small>' + sub + '</small>' : '') + '</div><div class="dk-row ' + cls + '">' + xs.map(item).join('') + '</div>' : '';
  return '<div class="dk">' +
    grp('家にある', '家族が取り出す', d.home, 'big') +
    grp('家族で作る', '', d.make, 'big') +
    grp('役所で取る', 'どの家でも同じ', d.office.map(t => ({ t, small: true })), 'small') + '</div>';
}

const OFFICE1 = ['戸籍（父）', '住民票の除票（父）', '印鑑証明書（全員）', '固定資産評価証明書'];
const OFFICE2 = ['戸籍（父・祖父一郎）', '住民票の除票（父・祖父一郎）', '印鑑証明書（全員）', '固定資産評価証明書'];
const KYO = { t: '遺産分割協議書', s: '相続人全員が署名し、実印を押す', dash: true };

const CASES = [
  { say: '父の遺言がなければ、父の相続人（家族）<b>全員で遺産分割協議</b>をして、土地と建物の名義を移します。', h: 'A　事情なし', s: '土地・建物とも父の名義・単独',
    fig: { lanes: [{ lb: '土地', nodes: ['父', '家族'] }, { lb: '建物', nodes: ['父', '家族'] }],
      hops: [{ from: 1, to: 2, t: '遺産分割協議書' }] },
    ppl: '話し合いに加わる：<b>父の相続人（家族）全員</b>',
    docs: { make: [KYO], office: OFFICE1 },
    steps: null, who: '司法書士に頼む（自分で法務局へ申請することもできる）' },

  { say: '土地は<b>祖父一郎の名義のまま</b>です。父の遺言がなければ、祖父一郎のほかの相続人も話し合いに加わり、<b>2人分の相続を1通の協議書</b>にまとめます。', prior: true, h: 'B　前の代の名義が残る', s: '土地は祖父一郎の名義のまま・父が取得すると口頭で決まっている',
    fig: { lanes: [{ lb: '土地', nodes: ['祖父一郎', '父', '家族'] }, { lb: '建物', nodes: ['父', '家族'] }],
      hops: [{ from: 0, to: 2, t: '1通の遺産分割協議書に、2人分をまとめる' }] },
    ppl: '話し合いに加わる：<b>父の相続人（家族）全員 ＋ 祖父一郎のほかの相続人</b>',
    docs: { make: [{ t: '遺産分割協議書', s: '父が取得すると口頭で決まっていただけで、書面はない。相続人全員が署名し、実印を押す', dash: true }], office: OFFICE2 },
    steps: null, who: '司法書士に頼む。父が1人で取得する協議書にすれば、土地も1回の申請で家族へ移せることがある' },

  { say: '土地は<b>祖父一郎の名義のまま</b>です。父の遺言がなければ、祖父一郎のほかの相続人も話し合いに加わり、<b>2人分の相続を1通の協議書</b>にまとめます。<b>北側の増築は登記に載っていません</b>。', prior: true, ext: true, open: true, h: 'C　前の代の名義＋登記にない増築（自宅）', s: 'B に加えて、北側の増築（約6畳）が登記に載っていない・工事の書類は分からない',
    fig: { lanes: [{ lb: '土地', nodes: ['祖父一郎', '父', '家族'] }, { lb: '建物', nodes: ['父', '家族'], hatch: true }],
      hops: [{ from: 0, to: 2, t: '1通の遺産分割協議書に、2人分をまとめる' }] },
    ppl: '話し合いに加わる：<b>父の相続人（家族）全員 ＋ 祖父一郎のほかの相続人</b>',
    docs: { home: [{ t: '工事の書類', s: '確認済証・工事請負契約書・領収書', no: '場所は分からない', dash: true }],
      make: [{ t: '遺産分割協議書', s: '口頭で決まっていただけで、書面はない。増築部分を誰が取得するかも書く', dash: true },
        { t: '上申書', s: '工事の書類が見つからないとき。相続人全員が実印を押す', dash: true }], office: OFFICE2 },
    steps: [{ t: '増築の表題変更登記', w: '土地家屋調査士' }, { t: '相続登記', w: '司法書士' }] },

  { say: '土地は祖父一郎の名義のままですが、<b>祖父一郎の遺言</b>で父が取得すると決まっています。父の遺言がなければ、話し合いは父の分だけで、父の相続人（家族）全員でします。', prior: true, h: 'D　前の代：遺言がある', s: '祖父一郎の自筆の遺言で父が取得・法務局には預けていない',
    fig: { lanes: [{ lb: '土地', nodes: ['祖父一郎', '父', '家族'] }, { lb: '建物', nodes: ['父', '家族'] }],
      hops: [{ from: 0, to: 1, t: '遺言' }, { from: 1, to: 2, t: '遺産分割協議書' }] },
    ppl: '話し合いに加わる：<b>父の相続人（家族）全員</b>（祖父一郎の分は遺言で決まっている）',
    docs: { home: [{ t: '祖父一郎の遺言書', s: '自筆。先に家庭裁判所の検認を受ける', at: '仏間の金庫' }], make: [KYO], office: OFFICE2 },
    steps: [{ t: '遺言書の検認', w: '家庭裁判所' }, { t: '相続登記', w: '司法書士' }] },

  { say: '土地は祖父一郎の名義のままですが、<b>協議書</b>で父が取得すると決まっています。父の遺言がなければ、話し合いは父の分だけで、父の相続人（家族）全員でします。', prior: true, h: 'E　前の代：協議書がある', s: '祖父一郎の遺産分割協議書（父が取得）あり・父の印鑑証明書も渡してある',
    fig: { lanes: [{ lb: '土地', nodes: ['祖父一郎', '父', '家族'] }, { lb: '建物', nodes: ['父', '家族'] }],
      hops: [{ from: 0, to: 1, t: '協議書（済み）' }, { from: 1, to: 2, t: '遺産分割協議書' }] },
    ppl: '話し合いに加わる：<b>父の相続人（家族）全員</b>（祖父一郎の分は協議書で決まっている）',
    docs: { home: [{ t: '祖父一郎の遺産分割協議書', s: '父が取得すると書いたもの。添える印鑑証明書も', at: '書斎のキャビネット上段' }], make: [KYO], office: OFFICE2 },
    steps: null, who: '司法書士に頼む。父が1人で取得しているので、1回の申請で家族へ移せることがある' },

  { say: '建物は<b>父の持分（1/2）だけ</b>を移します。<b>前の私道の持分</b>も同じ申請に入れます。私道は課税明細書に載らないことがあるので、名寄帳か所有不動産記録証明で地番を確かめます。', road: true, h: 'F　共有と私道の持分', s: '建物は父と母の共有（1/2）・前の私道に持分がある',
    fig: { lanes: [{ lb: '土地', nodes: ['父', '家族'] }, { lb: '建物', nodes: ['父 1/2', '家族'] }, { lb: '私道', nodes: ['父（持分）', '家族'] }],
      hops: [{ from: 1, to: 2, t: '遺産分割協議書' }] },
    ppl: '建物の母の持分（1/2）はそのまま。<b>私道の持分は課税明細書に載らない</b>ことがあるので、名寄帳か所有不動産記録証明で地番を確かめて同じ申請に入れる',
    docs: { make: [KYO], office: OFFICE1.concat(['名寄帳']) },
    steps: null, who: '司法書士に頼む（自分で法務局へ申請することもできる）' }
];

/* くわしく（場面ごと）。前の代・増築・私道で中身が変わるところだけ c から読む。 */
function detail(c) {
  const h = (i, t) => '<section><h6><i>' + i + '</i>' + t + '</h6>';
  const will = h(1, '遺言が見つかったとき') +
    '<p>公正証書の遺言は公証役場で、法務局に預けた自筆の遺言は法務局で、あるかどうか調べられます。</p>' +
    '<p>家で<b>封のある自筆の遺言</b>を見つけたら、開けずに家庭裁判所の<b>検認</b>を受けます。勝手に開けると5万円以下の過料の対象になります（開けても遺言は無効になりません）。</p>' +
    '<p>遺言で取得する人が決まっていれば、その分は話し合いが要りません。</p></section>';
  const late = h(2, '間に合わないとき') +
    '<p>3年以内に話し合いがまとまらないときは、次のどちらかで義務を果たせます。</p>' +
    '<div class="pr-two"><div><small>相続人申告登記</small><p>申し出た人の義務が果たされる。登録免許税はかからない<br><span class="ng">名義は移らず、売れない</span></p></div>' +
    '<div><small>法定相続分での相続登記</small><p>相続人の一人が全員分を申請できる。登録免許税がかかる<br><span class="ng">全員の共有になり、売るには全員の同意が要る</span></p></div></div>' +
    '<p>どちらの場合も、話し合いがまとまったら、その日から3年以内に分割の結果で登記します。正当な理由なく怠ると、法務局からの催告に応じない場合に10万円以下の過料の対象になります。</p></section>';
  const cost = h(3, '費用') +
    '<p><b>登録免許税</b>は、固定資産税評価額の0.4%です。評価額は毎年届く課税明細書に載っています。</p>' +
    (c.road ? '<p>固定資産税がかからない私道には評価額がないので、課税価格の出し方を法務局に確かめます。</p>' : '') +
    '<p>司法書士の報酬は平均で約7.5万円です（日本司法書士会連合会の令和6年の調べ。土地1筆・建物1棟・評価額1,000万円・相続人3人の場合）。' +
    (c.prior ? '祖父一郎の分も合わせた2人分の手続きになるので、これより増えます。' : '') + '</p>' +
    (c.ext ? '<p>増築の表題変更登記の費用（土地家屋調査士への報酬）が、これとは別にかかります。</p>' : '') + '</section>';
  const self = h(4, '自分で申請するとき') +
    '<p>申請書のひな形と記載例は、法務局のホームページにあります。法務局の<b>登記手続案内</b>（予約制・無料）で相談でき、郵送でも申請できます。</p>' +
    '<p>戸籍は、最寄りの市区町村の窓口でまとめて請求できます（広域交付。請求する人が窓口へ行きます。きょうだいの戸籍は対象外）。</p>' +
    '<p><a href="https://www.moj.go.jp/MINJI/minji05_00599.html" target="_blank" rel="noopener">法務省｜相続登記の案内 ↗</a></p></section>';
  const open = OPEN.has(c.h);
  const DOWN = '<svg viewBox="0 0 12 12" aria-hidden="true"><path d="M2.5 4.5 6 8l3.5-3.5" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>';
  return '<div class="pr-dt' + (open ? ' open' : '') + '"><button type="button" class="pr-dt-t" data-open="' + c.h + '" aria-expanded="' + open + '">' +
    '<span class="pr-dt-k">くわしく</span><span class="pr-dt-s">遺言が見つかったとき・間に合わないとき・費用・自分で申請するとき</span>' + DOWN + '</button>' +
    (open ? '<div class="pr-dt-b">' + will + late + cost + self + '</div>' : '') + '</div>';
}

function card(c) {
  const steps = c.steps
    ? '<div class="sq">' + c.steps.map((s, i) => (i ? '<span class="sq-ar">→</span>' : '') +
        '<div class="sq-step"><b>' + (i + 1) + '　' + s.t + '</b><small>' + s.w + '</small></div>').join('') + '</div>'
    : '<p class="one">' + c.who + '</p>';
  return '<section class="case"><h2>' + c.h + '<small>' + c.s + '</small></h2>' +
    '<article class="procedure-sheet">' +
    '<header class="procedure-head">' + TOKI + '<div><h5>相続登記</h5></div></header>' +
    '<div class="procedure-deadline">' + CAL + '<span><b>期限</b> 取得を知った日から3年以内</span></div>' +
    '<p class="sw-say">' + c.say + '</p>' +
    '<div class="sw-sec"><p class="sw-lb">そろえる書類</p>' + docs(c.docs) +
      '<p class="dk-not"><b>権利証（登記識別情報）は要りません。</b>売るときに使います。</p></div>' +
    '<div class="sw-sec"><p class="sw-lb">' + (c.steps ? '順番' : '頼む先') + '</p>' + steps + '</div>' +
    detail(c) +
    '</article></section>';
}
/* くわしくの開閉。初めは C（自宅）だけ開いておく。押すたびに描き直す。 */
const OPEN = new Set(CASES.filter(c => c.open).map(c => c.h));
const grid = document.getElementById('grid');
function paint() { grid.innerHTML = CASES.map(card).join(''); }
grid.addEventListener('click', e => {
  const b = e.target.closest('[data-open]'); if (!b) return;
  const k = b.dataset.open; OPEN.has(k) ? OPEN.delete(k) : OPEN.add(k); paint();
});
paint();
</script>
</body>
</html>
