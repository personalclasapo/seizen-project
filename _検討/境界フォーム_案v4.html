<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>境界フォーム 案v4</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../prototype/shared/tokens.css">
<link rel="stylesheet" href="../prototype/real-estate/area.css">
<style>
/* 案v4（2026-09-29）：v3 から件の枠の色だけ。
   v3 の #ECE8DC は帯（#f4f1e9）より濃く、帯が枠より明るく浮いて濁った。枠は帯より明るくし、
   帯を中でいちばん濃い面に保つ：背景 #fffdf8 → 件の枠 #F7F5EE（このダイアログの足元・目次と同じ地）
   → 白い札 → 帯 #f4f1e9。枠の線は札と同じ #d9d3c4。
   以下 v3 の記録：
   案v3（2026-09-29）：v2 から2点。
   ・件の枠の地を、背景（#fffdf8）とも話題の帯（#f4f1e9）とも違う一段濃い地に（#ECE8DC）。
     層は 背景 → 件の枠 → 白い札（灰色の帯）。v1 は枠＝帯の色、v2 は枠＝背景の色で、層が見えなかった
   ・上の問いの注記を置かない（問いと選択肢で答え方が決まる。書類の話は「父も覚えていない」の後の問いが持つ）
   以下 v2 の記録：
   案v2（2026-09-29）：v1 の案Bだけを直す。
   ・外枠の地を塗らない（v1 は帯と同じ色を敷き、枠全体が帯のように濁った）
   ・件の目次を、上の問いの注記の下へ。本文と一緒に流れ、件の頭へ来たら上端に貼り付く
   ・上の問いの注記を言い直す
   ダイアログは本番と同じく高さを切り、中をスクロールして確かめられるようにする。
   見本：本番のダイアログの部品（.re-dialog・.re-q・.re-opts・.re-entry・.re-card）をそのまま使い、
   境界・越境の取り決めの「件の見出し」と「話題の見出し」の置き方だけを変えて並べる。 */
body{margin:0;padding:24px;background:#8d938a;font-family:var(--font);display:flex;flex-direction:column;align-items:center;gap:14px}
.cap{color:#fff;width:860px;margin-top:22px}
.cap b{display:block;font:700 15px/1.5 var(--font)}
.cap span{display:block;font:500 13px/1.7 var(--font);opacity:.9}
.re-dialog{display:block;position:static;width:860px;max-height:none;margin:0}
.re-dialog form{max-height:none}
.re-dialog-foot>span{margin-right:auto}

/* 問いの横に追加の入口（全案共通） */
.mk-qt{display:flex;align-items:center;justify-content:space-between;gap:16px;margin:0 0 10px}
.mk-qt .re-q-t{margin:0}
.mk-qt .record-add{margin:0;flex:none}
/* 札の帯に添える「当てはまるものをすべて」 */
.mk-note{margin-left:10px;font-weight:500;color:#858978;letter-spacing:0}
.re-card-b>.re-q-h:first-child{margin-top:0}
.re-card textarea{width:100%;box-sizing:border-box}
.re-card-b .re-opts.row{max-width:none}
/* 上の問いと最初の件の間（案だけ。「今」は本番のまま） */
.X .re-q+.re-entry,.re-q+.mk-e{margin-top:28px}

/* 例：件の帯の中に、話題の札 */
.X .re-entry .re-card{box-shadow:none}

/* A：件の見出しは札の外（帯にしない）。帯は話題だけ */
.A .mk-e+.mk-e{margin-top:30px;padding-top:24px;border-top:1px solid #e3dfd2}
.mk-eh{display:flex;align-items:center;gap:10px;margin:0 0 12px}
.mk-eh b{font-size:15px;font-weight:700;color:#3C4437}
.mk-eh .re-entry-sub{font-size:13px}

/* B：件を外枠で囲む。見出しは枠の頭の行（帯にしない）。帯は話題だけ */
.B .mk-e{border:1px solid #d9d3c4;border-radius:10px;background:#F7F5EE;padding:12px 14px 14px}
.B .mk-e{scroll-margin-top:64px}
.B .mk-e+.mk-e{margin-top:16px}
.B .mk-eh{margin:0 0 12px;padding:0 4px}
/* 目次を本文の中へ（上の問いの注記の下）。上端に来たら貼り付く。地は本文と同じ */
.B .re-dialog-body{padding-top:20px}
.B .re-dialog-body .re-toc{position:sticky;top:-21px;z-index:2;margin:0 -28px 16px;padding:11px 28px;
  background:#fffdf8;border-top:1px solid #e5dfd3;border-bottom:1px solid #e5dfd3}
.B .re-q+.re-toc{margin-top:22px}
.B .re-toc+.mk-e{margin-top:0}
/* 本番と同じく高さを切る（画面の高さ − 48px） */
.B.re-dialog form{max-height:calc(100vh - 48px)}
</style>
</head>
<body>
<div id="root"></div>
<script>
let VK = '';
let HINT = '境界標や法務局の地積測量図は家族でも確かめられます。口頭で決めたことは、父に聞くしかありません。';
const esc = s => String(s == null ? '' : s);
const opt = (type, name, v, label, sub, on) => '<label class="re-opt"><input type="' + type + '" name="' + VK + name + '" value="' + v + '"' + (on ? ' checked' : '') + '><span><b>' + label + '</b>' + (sub ? '<small>' + sub + '</small>' : '') + '</span></label>';
const pills = (name, cur, opts) => '<div class="re-opts pill">' + opts.map(([v, l]) => opt('radio', name, v, l, '', v === cur)).join('') + '</div>';
const rows = (name, cur, opts) => '<div class="re-opts row">' + opts.map(([v, l, s]) => opt('radio', name, v, l, s, v === cur)).join('') + '</div>';
const multi = (name, on, opts) => '<div class="re-opts row multi">' + opts.map(([v, l, s]) => opt('checkbox', name + v, v, l, s, on.includes(v))).join('') + '</div>';
const hint = t => '<p class="re-q-h">' + t + '</p>';
const q = (t, body, h) => '<div class="re-q"><p class="re-q-t">' + t + '</p>' + body + (h ? hint(h) : '') + '</div>';
const card = (t, body) => '<div class="re-card"><div class="re-card-h">' + t + '</div><div class="re-card-b">' + body + '</div></div>';
const no = i => '<span class="re-entry-no" aria-hidden="true">' + (i + 1) + '</span>';
const del = '<span class="re-entry-delw"><button type="button" class="re-entry-del">削除</button></span>';

/* 2件：①左隣（◇◇さん・境界の位置を決めた・口頭のまま） ②右隣（まだ何も選んでいない） */
const E = [
  { side: 'left', nb: '左隣', who: '◇◇さん', kinds: ['line'], paper: 'no', memo: '塀を直すときの費用は、半分ずつ出す。' },
  { side: 'right', nb: '右隣', who: '', kinds: [], paper: 'unknown', memo: '' }];
const title = e => e.nb + 'との取り決め';

/* 件の中身。parts は話題ごとに [見出し, 本文]。 */
const parts = (e, i, withNote) => {
  const n = k => 'e' + i + '-' + k;
  const line = multi(n('kind-'), e.kinds, [['line', '境界の位置', '塀の中心を境界にした、など']]) +
    (e.kinds.includes('line') ? '<div class="re-sub"><p class="re-sub-t">何を目印に決めましたか</p>' +
      pills(n('mark'), 'wall', [['wall', '塀'], ['stake', '境界標（杭・金属の鋲など）'], ['none', '目印はない']]) +
      '<div data-e-wall><p class="re-sub-t">その塀は誰のものですか</p>' + rows(n('wallOwner'), 'both', [
        ['both', '両家のもの', '境界の上に建っている'], ['ours', '自宅のもの', '自宅の土地に建っている'], ['theirs', e.nb + 'のもの', e.nb + 'の土地に建っている']]) + '</div></div>' : '') +
    multi(n('kind-'), e.kinds, [['over', '越境しているものの扱い', '塀・屋根・枝・配管などが境界を越えている']]);
  return [
    ['相手', pills(n('side'), e.side, [['right', '右隣'], ['left', '左隣'], ['back', '裏の家']]) +
      '<div class="re-q-sub"><input class="re-q-in" value="' + e.who + '" placeholder="相手の名前（分かれば）"></div>' + hint('玄関を出て見た向きで。裏の家は、玄関の反対側の家。')],
    ['決めたこと' + (withNote ? '<span class="mk-note">当てはまるものをすべて</span>' : ''), line],
    ['書面', pills(n('paper'), e.paper, [['yes', '覚書・境界確認書がある'], ['no', '口頭のまま'], ['unknown', '分からない']])],
    ['ほかに決めたこと', '<textarea class="re-q-in" rows="2">' + e.memo + '</textarea>' + hint('上で選んだこと以外に。例：越えている枝は、毎年秋に隣が切る。')]];
};

const topQ = add => '<div class="re-q">' + (add
    ? '<div class="mk-qt"><p class="re-q-t">隣と、境界や塀・越境について決めたことはありますか</p><button type="button" class="record-add" aria-label="隣との取り決めを追加"><span aria-hidden="true">＋</span>追加</button></div>'
    : '<p class="re-q-t">隣と、境界や塀・越境について決めたことはありますか</p>') +
  pills('deal', 'yes', [['yes', 'ある'], ['no', 'ない'], ['unasked', 'まだ聞いていない'], ['unknown', '父も覚えていない']]) +
  (HINT ? hint(HINT) : '') + '</div>';

const toc = '<nav class="re-toc"><span class="re-toc-lb">隣との取り決め 2件</span>' + E.map((e, i) =>
  '<button type="button"' + (i ? '' : ' aria-current="true"') + '>' + no(i) + '<span>' + title(e) + (e.who ? '<small>' + e.who + '</small>' : '') + '</span></button>').join('') + '</nav>';
const head = (e, i) => no(i) + '<b>' + title(e) + '</b><span class="re-entry-sub">' + e.who + '</span>' + del;

const build = {
  /* 手本：建物の権利関係（本番の組み方。上の2枚だけ） */
  R: () => ['手本｜建物の権利関係', '灰色の帯＝話題の見出し（名義／登記内容と違うところ）', '建物の権利関係', '',
    card('名義', '<div class="re-lines">' +
      '<div class="re-ln"><span class="re-ln-lb">持ち方</span><div class="re-ln-v">' + pills('hold', 'own', [['own', '所有'], ['share', '共有'], ['other', 'その他']]) + '</div></div>' +
      '<div class="re-ln"><span class="re-ln-lb">名義人</span><div class="re-ln-v"><input class="re-q-in" value="父"></div></div></div>' + hint('登記事項証明書のとおりに。')) +
    '<div style="height:14px"></div>' +
    card('登記内容と違うところ', '<div class="re-lines">' +
      '<div class="re-ln"><span class="re-ln-lb">前の代の名義</span><div class="re-ln-v">' + pills('prior', 'no', [['yes', '残っている'], ['no', '残っていない'], ['unknown', 'まだ確かめていない']]) + '</div></div>' +
      '<div class="re-ln"><span class="re-ln-lb">増築<small class="re-ln-z">奥・2015年ごろ</small></span><div class="re-ln-v">' + pills('reg', 'no', [['yes', '載っている'], ['no', '載っていない'], ['unknown', 'まだ確かめていない']]) + '</div></div></div>' + hint('登記事項証明書で分かります。'))],
  /* B（v2）：外枠は線だけ・目次は注記の下・注記を言い直す */
  B: () => { HINT = ''; return ['案B（v4）｜件の枠の色を直した', '件の枠は帯より明るい地（#F7F5EE）。帯が中でいちばん濃い面のまま', '境界・越境の取り決め', '',
    topQ(true) + toc + E.map((e, i) => '<div class="mk-e" id="e' + i + '"><div class="mk-eh">' + head(e, i) + '</div>' +
      parts(e, i, true).map(([t, b]) => card(t, b)).join('<div style="height:12px"></div>') + '</div>').join('')]; }
};
document.getElementById('root').outerHTML = Object.keys(build).map(k => {
  VK = k + '-';
  const [cap, sub, h2, nav, html] = build[k]();
  return '<div class="cap"><b>' + cap + '</b><span>' + sub + '</span></div><div class="re-dialog ' + k + '" id="v' + k + '"><form>' +
    '<header class="re-dialog-head"><div><p class="re-eyebrow">自宅 ／ 確認と記録</p><h2>' + h2 + '</h2></div><button type="button" class="re-close">×</button></header>' +
    nav + '<div class="re-dialog-body">' + html + '</div>' +
    '<footer class="re-dialog-foot"><span>分かったところまで残せます</span><button type="button">キャンセル</button><button class="re-save" type="button">記録を保存</button></footer></form></div>';
}).join('');
/* 目次：押すとその件へ、いま見ている件に色 */
document.querySelectorAll('.B .re-toc button').forEach((b, i) => b.addEventListener('click', () => document.getElementById('e' + i).scrollIntoView({ behavior: 'smooth', block: 'start' })));
const bd = document.querySelector('.B .re-dialog-body');
bd.addEventListener('scroll', () => { const line = bd.getBoundingClientRect().top + bd.clientHeight / 3; let cur = 0;
  document.querySelectorAll('.B .mk-e').forEach((el, i) => { if (el.getBoundingClientRect().top <= line) cur = i; });
  document.querySelectorAll('.B .re-toc button').forEach((b, i) => i === cur ? b.setAttribute('aria-current', 'true') : b.removeAttribute('aria-current')); }, { passive: true });
</script>
</body>
</html>
