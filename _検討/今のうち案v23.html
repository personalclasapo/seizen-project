<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>不動産｜「今のうち」の造形 3案（v23）</title>
<link rel="stylesheet" href="../prototype/shared/tokens.css">
<style>
  body{margin:0;background:var(--page);font-family:var(--font);color:var(--ink);
    padding:28px 20px 60px}
  .wrap{max-width:1060px;margin:0 auto}
  h1{font-size:19px;margin:0 0 6px}
  .lead{font-size:12.5px;color:var(--ink2);margin:0 0 24px;line-height:1.85}
  .lead b{color:var(--ink)}
  h2{font-size:14px;margin:38px 0 4px;display:flex;align-items:baseline;gap:10px}
  h2 span{font-size:11.5px;font-weight:400;color:var(--ink3)}
  .stage{background:var(--card);border:1px solid var(--line);border-radius:10px;
    padding:20px;margin-top:10px}
  .cap{font-size:12.5px;margin:0 0 12px;color:var(--ink2);line-height:1.8}
  .cap b{color:var(--ink);font-size:13.5px}

  .plan{position:relative;width:100%;margin-bottom:6px}
  .plan svg{display:block;width:100%;height:auto}
  .layer{position:absolute;inset:0}
  .cell{position:absolute;overflow:hidden;display:flex;flex-direction:column}
  .cell > h4{font-size:11.5px;margin:0 0 6px;color:var(--ink2);font-weight:600;
    letter-spacing:.04em;flex:none}
  .body{flex:1;overflow-y:auto;min-height:0}
  .body::-webkit-scrollbar{width:4px}
  .body::-webkit-scrollbar-thumb{background:#DCD6C8;border-radius:2px}

  /* ══ ほかの部屋（v22 のまま。今回の対象ではない）══════════ */
  .tbd{font-size:11.5px;color:var(--ink3);line-height:1.8}
  .tbd .tl{font-size:12px;color:var(--ink2);font-weight:600;margin-bottom:4px}
  .tbd .ti{padding:4px 0 4px 15px;position:relative;border-top:1px solid #F0EBE0}
  .tbd .ti:first-of-type{border-top:0}
  .tbd .ti::before{content:'';position:absolute;left:3px;top:11px;width:4px;height:4px;
    border-radius:50%;background:#DAD2BE}
  .q{padding:7px 0;border-top:1px solid #EAE4D6}
  .q:first-child{border-top:0}
  .qh{display:flex;align-items:baseline;gap:6px;font-size:12px}
  .qh .qt{font-weight:600}
  .qa{font-size:11.5px;color:var(--ink2);line-height:1.72;margin-top:3px}
  .qd{margin-top:3px;padding-left:10px;border-left:2px solid #E4DCC8;
    font-size:11px;color:var(--ink2);line-height:1.7}
  .qd i{font-style:normal;color:var(--ink3);margin-right:4px}
  .own{display:flex;gap:10px}
  .own > div{flex:1;min-width:0}
  .ow{font-size:10px;color:var(--ink3);letter-spacing:.08em;margin-bottom:2px}
  .onm{font-size:12px;font-weight:600;line-height:1.5}
  .osub{font-size:10.5px;color:var(--ink2);line-height:1.6;margin-top:2px}
  .who{padding:7px 0;border-top:1px solid #EAE4D6}
  .who:first-child{border-top:0}
  .wn{font-size:12px;font-weight:600}
  .wk{font-size:10px;color:var(--ink3);margin-left:5px}
  .wd{font-size:11px;color:var(--ink2);line-height:1.68;margin-top:1px}
  .wt{font-size:10.5px;color:var(--ink3);margin-top:1px;
    font-variant-numeric:tabular-nums}
  .doc{display:flex;align-items:baseline;gap:6px;padding:3px 0;
    font-size:11px;line-height:1.6;border-top:1px solid #F0EBE0}
  .doc:first-child{border-top:0}
  .doc .nm{flex:1;min-width:0}
  .place{font-size:10.5px;color:var(--ink3);margin-top:6px;padding-top:5px;
    border-top:1px solid #E4DFD1;line-height:1.6}
  .bdg{display:inline-block;font-size:10px;padding:0 5px;border-radius:3px;
    border:1px solid var(--line);color:var(--ink2);background:var(--paper2);
    white-space:nowrap}
  .bdg.or{color:#9A6A2F;border-color:#E2CDA8;background:#FBF3E5}
  .bdg.gr{color:#4E7A54;border-color:#C6DCC8;background:#F0F6F0}
  .bdg.gy{color:var(--ink3)}

  /* ══ 今のうち：3案 ═══════════════════════════════════
     いずれも、造形そのものは SVG（decorate が描く）。ここにあるのは
     字の置かれ方だけ。矩形に色を敷いて物の代わりにはしない。      */

  /* 案A｜文机に広げた便箋。1枚の紙に、本人が書いていく。 */
  .A .cell[data-id=liv] > h4{display:none}
  .A .pa-h{font-family:var(--font-serif);font-size:13.5px;letter-spacing:.06em;
    margin:0 0 9px;color:#4A4741}
  .A .gblk{margin-bottom:9px}
  .A .gblk:last-child{margin-bottom:0}
  .A .grp{font-size:10.5px;color:#8E8778;letter-spacing:.07em;margin:0 0 2px}
  .A .row{font-size:12px;line-height:1.75;padding:1px 0 1px 13px;position:relative}
  .A .row b{font-weight:600}
  .A .row .to{color:var(--ink2);font-size:11px;margin-left:3px}
  .A .row .tel{font-size:10.5px;color:var(--ink3);margin-left:4px;
    font-variant-numeric:tabular-nums}

  /* 案B｜床に広げて、群ごとに付箋を貼る。 */
  .B .cell[data-id=liv] > h4{position:relative;z-index:1}
  .B .fan{display:flex;flex-wrap:wrap;gap:9px;align-items:flex-start}
  .B .gblk{width:calc(50% - 5px);box-sizing:border-box;padding:9px 10px 10px}
  .B .fh{font-size:11px;font-weight:600;color:#5C5847;margin-bottom:4px;
    letter-spacing:.03em}
  .B .row{font-size:11.5px;line-height:1.65;margin-top:3px}
  .B .row b{font-weight:600}
  .B .row .to{color:var(--ink2);font-size:10.5px;display:block}
  .B .row .tel{font-size:10px;color:var(--ink3);
    font-variant-numeric:tabular-nums}

  /* 案C｜文箱が4つ。群＝箱、1件＝中の紙。 */
  .C .boxes{display:flex;flex-wrap:wrap;gap:10px;align-items:flex-start}
  .C .gblk{width:calc(50% - 5px);box-sizing:border-box;padding:8px 9px 9px}
  .C .bh{font-size:10.5px;color:#7C7767;letter-spacing:.06em;margin-bottom:5px}
  .C .sheet{font-size:11.5px;line-height:1.6;padding:4px 7px;margin-top:3px}
  .C .sheet b{font-weight:600}
  .C .sheet .to{color:var(--ink2);font-size:10.5px;display:block}
  .C .sheet .tel{font-size:10px;color:var(--ink3);
    font-variant-numeric:tabular-nums}
</style>
</head>
<body>
<div class="wrap">

<h1>不動産・住まい｜「今のうち」の造形 3案（v23）</h1>
<p class="lead">
  間取りの外側（壁・開口・玄関・部屋の大きさの決まり方）は v22 のまま。
  <b>「今のうち」の部屋の中だけ</b>を3案に差し替えて、他の部屋は触っていない。<br>
  平面図は上から見た図なので、<b>中に置く物も上から見た形</b>で描く
  ―― 壁に貼った紙は平面図では線にしかならない。机・紙・付箋・文箱は、
  上から見て形が読める物として選んだ。<br>
  造形はすべて SVG（<code>decorate()</code>）。<b>字を置いてから、その実測位置に
  物を描く</b>ので、紙や箱の大きさを手で詰める作業が要らない。
</p>

<div id="out"></div>

</div>

<script src="../prototype/real-estate/state.js"></script>
<script>
const S = window.SeiZenRealEstate;
const esc = s => String(s == null ? '' : s)
  .replace(/&/g,'&amp;').replace(/</g,'&lt;');
const tone = st => st === 'done' ? 'gr' : (st === 'none' ? 'gy' : 'or');
const NS = 'http://www.w3.org/2000/svg';
const el = (n, a) => { const e = document.createElementNS(NS, n);
  for (const k in a) e.setAttribute(k, a[k]); return e; };

/* ── 今のうちの中身（v22 の ACTS のまま。文言は後で作り直す）── */
const ACTS = {
  p1: [
    ['連絡', '○○管理株式会社', '管理費の引き落とし口座を変更する', '045-123-4567'],
    ['連絡', '○○銀行 青葉台支店', '団信の手続きを申し出る', ''],
    ['連絡', '西隣の◇◇さん', '境界の話が途中のままになっている', ''],
    ['引継', '建物管理の契約', '管理費・修繕積立金 月12,000円（毎月27日）', ''],
    ['確認', '土地の名義', '父のまま。兄弟3人が相続人', ''],
    ['確認', '北側の増築部分', '未登記。確認申請の有無も不明', ''],
    ['手続', '相続登記', '土地の名義を本人へ', ''],
    ['手続', 'ローンの完済', '団信により完済される見込み', '']
  ]
};
const GN = { 連絡:'誰に連絡するか', 引継:'何を引き継ぐか',
             確認:'何を確認するか', 手続:'何を手続きするか' };
function groupsOf(acts) {
  const out = []; let cur = null;
  acts.forEach(a => {
    if (!cur || cur.key !== a[0]) { cur = { key:a[0], name:GN[a[0]], items:[] };
      out.push(cur); }
    cur.items.push(a);
  });
  return out;
}

/* ── ほかの部屋（v22 のまま）───────────────────────── */
function whenHTML(p) {
  const TBD = { p1: ['鍵と権利証がどこにあるか', '誰が住み続けるか・引き払うか',
    '管理費と修繕積立金の引き落としを止めるか続けるか',
    '売るか貸すか持ち続けるか'] };
  const xs = TBD[p.id] || [];
  return '<div class="tbd"><div class="tl">まだ決めていない</div>' +
    xs.map(x => `<div class="ti">${esc(x)}</div>`).join('') + '</div>';
}
function matterHTML(p) {
  return Object.keys(p.matters).map(k => {
    const m = p.matters[k], f = S.FINDINGS[m.find];
    const t = m.find === 'no' ? 'gy' : 'or';
    let h = `<div class="q"><div class="qh"><span class="qt">` +
            `${esc(S.MATTERS[k].label)}</span>` +
            `<span class="bdg ${t}">${esc(f.label)}</span></div>`;
    if (m.memo) h += `<div class="qa">${esc(m.memo)}</div>`;
    if (m.detail) {
      const d = m.detail, bits = [];
      if (d.who)   bits.push(`<i>相手</i>${esc(d.who)}`);
      if (d.deal)  bits.push(`<i>取り決め</i>${esc(d.deal)}`);
      if (d.paper) bits.push(`<i>書面</i>${esc(d.paper)}`);
      if (d.reg)   bits.push(`<i>登記</i>${esc(d.reg)}`);
      if (d.state) bits.push(`<i>状況</i>${esc(d.state)}`);
      h += `<div class="qd">${bits.join('　')}</div>`;
    }
    return h + '</div>';
  }).join('');
}
function rightHTML(p) {
  const one = (k, lb) => {
    const r = p.rights[k], mt = S.MATCH[r.match];
    return `<div><div class="ow">${lb}</div>` +
      `<div class="onm">${esc(r.owner)}` +
      (r.shares ? `<span class="bdg gy" style="margin-left:4px">${esc(r.shares)}</span>` : '') +
      '</div>' +
      `<div class="osub"><span class="bdg ${mt.tone === 'gr' ? 'gr' : 'or'}">` +
      `登記と${esc(mt.label)}</span>` +
      (r.memo ? '<br>' + esc(r.memo) : '') + '</div></div>';
  };
  return '<div class="own">' + one('land', '土地') + one('bldg', '建物') + '</div>';
}
function partyHTML(p) {
  let h = ''; const l = p.loan;
  if (l.has) {
    h += `<div class="who"><span class="wn">${esc(l.bank)}</span>` +
      `<span class="wk">借入</span>` +
      `<div class="wd">${esc(l.type)}・${esc(l.debtor)}。団信${esc(l.gtee)}</div>` +
      `<div class="wd">担保 ${esc(l.mortgage)}</div></div>`;
  }
  (p.deals || []).forEach(d => {
    h += `<div class="who"><span class="wn">${esc(d.who)}</span>` +
      `<span class="wk">${esc(S.DEALS[d.kind].label)}</span>` +
      `<div class="wd">${esc(d.what)}</div>` +
      `<div class="wt">${esc(d.tel)}</div></div>`;
  });
  return h;
}
function docsHTML(p) {
  let h = S.neededDocs(p).map(d => {
    const st = S.ST[d.st] || { label: d.st };
    return `<div class="doc"><span class="nm">${esc(d.label)}</span>` +
      `<span class="bdg ${tone(d.st)}">${esc(st.label)}</span></div>`;
  }).join('');
  h += '<div class="place">' +
    (p.docs && p.docs.place ? esc(p.docs.place) : '保管場所は未確認') + '</div>';
  return h;
}

/* ══════════════════════════════════════════════════════════
   ■ 3案。html は字の置かれ方、decorate は物の形（SVG）。
     decorate は「字を置いたあと」に呼ばれ、実測位置へ描く。     */

const ROW = a => `<b>${esc(a[1])}</b><span class="to">${esc(a[2])}</span>` +
  (a[3] ? `<span class="tel">${esc(a[3])}</span>` : '');

const VARIANTS = [

/* ── 案A｜文机に広げた便箋 ─────────────────────────
   1枚の紙に、本人が上から書いていく。群は紙の中の小見出しで、
   罫も枠も持たない ―― 紙が1枚あるだけ。まだ書かれていない行は
   紙の下の余白として残り、それがそのまま「これから書くところ」。 */
{
  id:'A', name:'文机に広げた便箋',
  desc:'本人が書いている1枚の紙。机の上に広げてあり、脇に万年筆と文鎮。' +
       '書かれていない下の余白が、これから聞くことの場所になる。',
  inset: 26,
  html(acts) {
    return '<div class="pa-h">この家のこと</div>' +
      groupsOf(acts).map(g => `<div class="gblk"><div class="grp">${esc(g.name)}</div>` +
        g.items.map(a => `<div class="row">${ROW(a)}</div>`).join('') +
        '</div>').join('');
  },
  decorate(g, cell, R) {
    /* 机は部屋いっぱい、紙は机の上、字は紙の上。順に内側へ入る。 */
    const paper = R.expand(cell, 11);
    const desk  = R.expand(cell, 24);

    /* 文机。上から見た天板＋木口の線＋木目。 */
    g.appendChild(el('rect', { x:desk.x, y:desk.y, width:desk.w, height:desk.h,
      rx:3, fill:'#C9B38C' }));
    g.appendChild(el('rect', { x:desk.x+2, y:desk.y+2, width:desk.w-4,
      height:desk.h-4, rx:2, fill:'#D8C4A0' }));
    for (let i = 1; i < 7; i++) {
      const y = desk.y + desk.h * i / 7;
      g.appendChild(el('line', { x1:desk.x+4, y1:y, x2:desk.x+desk.w-4, y2:y,
        stroke:'#C6AF89', 'stroke-width':.8, opacity:.55 }));
    }

    /* 便箋。紙の縁に薄い影、左に朱の余白線、上辺に綴じの点線。 */
    g.appendChild(el('rect', { x:paper.x+1.5, y:paper.y+2, width:paper.w,
      height:paper.h, rx:1, fill:'#9E8A66', opacity:.28 }));
    g.appendChild(el('rect', { x:paper.x, y:paper.y, width:paper.w,
      height:paper.h, rx:1, fill:'#FFFDF6', stroke:'#E3DCC9',
      'stroke-width':.9 }));
    g.appendChild(el('line', { x1:paper.x+9, y1:paper.y+4, x2:paper.x+9,
      y2:paper.y+paper.h-4, stroke:'#D8A9A0', 'stroke-width':.9 }));
    g.appendChild(el('line', { x1:paper.x+4, y1:paper.y+7, x2:paper.x+paper.w-4,
      y2:paper.y+7, stroke:'#EFE7D4', 'stroke-width':.8,
      'stroke-dasharray':'3 3' }));

    /* 万年筆。紙の右脇、机の上に置いてある。 */
    const px = paper.x + paper.w + 6, py = paper.y + 14;
    g.appendChild(el('rect', { x:px, y:py, width:3.4, height:34, rx:1.7,
      fill:'#3B3A36' }));
    g.appendChild(el('path', { d:`M${px} ${py+34} h3.4 l-1.7 6 z`,
      fill:'#B99A55' }));
    g.appendChild(el('rect', { x:px, y:py+7, width:3.4, height:2.2,
      fill:'#B99A55' }));

    /* 文鎮。紙の下辺を押さえている。 */
    const fx = paper.x + paper.w * .62;
    g.appendChild(el('rect', { x:fx, y:paper.y+paper.h-9, width:34, height:5,
      rx:2.5, fill:'#7E7A72' }));
    g.appendChild(el('rect', { x:fx+1, y:paper.y+paper.h-8.4, width:32,
      height:1.6, rx:.8, fill:'#98948B' }));
  }
},

/* ── 案B｜床に広げて、群ごとに付箋 ─────────────────
   4つの群を4枚の付箋にする。件数が塊の大きさになって見え、
   どの群が重いかが字を読む前に分かる。付箋なので、位置を
   動かせそうに見える ―― まだ決まっていないものとして。        */
{
  id:'B', name:'床に広げた紙と付箋',
  desc:'群ごとに1枚の付箋。件数が塊の大きさとして見えるので、' +
       'どこが重いかを字を読む前に受け取れる。',
  inset: 18,
  html(acts) {
    return '<div class="fan">' + groupsOf(acts).map(g =>
      `<div class="gblk"><div class="fh">${esc(g.name)}</div>` +
      g.items.map(a => `<div class="row">${ROW(a)}</div>`).join('') +
      '</div>').join('') + '</div>';
  },
  decorate(g, cell, R) {
    const sheet = R.expand(cell, 10);
    /* 下敷きの紙（机ではなく、床に直接広げてある）。 */
    g.appendChild(el('rect', { x:sheet.x+1, y:sheet.y+2, width:sheet.w,
      height:sheet.h, fill:'#A79E8A', opacity:.22 }));
    g.appendChild(el('rect', { x:sheet.x, y:sheet.y, width:sheet.w,
      height:sheet.h, fill:'#FBF8EF', stroke:'#E5DFCE', 'stroke-width':.9 }));

    /* 付箋。群ごとに、実測した塊の位置へ1枚ずつ。
       色は群の性格ではなく並び順で変える（分類色を増やさない）。 */
    const COL = [['#F2E2B4','#E6D29A'], ['#DCE8D4','#C7D9BD'],
                 ['#E7DCEA','#D5C6DA'], ['#F3DCCB','#E3C4AB']];
    R.blocks(g.ownerDocument, '.gblk').forEach((b, i) => {
      const c = COL[i % COL.length];
      g.appendChild(el('rect', { x:b.x+1, y:b.y+1.6, width:b.w, height:b.h,
        fill:'#9C927C', opacity:.28 }));
      /* 付箋は右下の角がわずかにめくれている。 */
      const cut = 9;
      g.appendChild(el('path', { fill:c[0], d:
        `M${b.x} ${b.y} h${b.w} v${b.h-cut} l${-cut} ${cut} h${-(b.w-cut)} z` }));
      g.appendChild(el('path', { fill:c[1], d:
        `M${b.x+b.w} ${b.y+b.h-cut} l${-cut} ${cut} v${-cut} z` }));
      /* 糊しろ（上辺の帯）。 */
      g.appendChild(el('rect', { x:b.x, y:b.y, width:b.w, height:4,
        fill:c[1], opacity:.55 }));
    });
  }
},

/* ── 案C｜文箱が4つ ────────────────────────────────
   群を箱に、1件を中の紙にする。箱は縁が二重線で、上から見ると
   中の紙が少しずつずれて重なっている。「入っている物」として
   数えられるのが、付箋との違い。                                */
{
  id:'C', name:'文箱に入れた紙',
  desc:'群＝箱、1件＝中の紙。箱の縁と紙の重なりで、入っている物として' +
       '数えられる。',
  inset: 16,
  html(acts) {
    return '<div class="boxes">' + groupsOf(acts).map(g =>
      `<div class="gblk"><div class="bh">${esc(g.name)}</div>` +
      g.items.map(a => `<div class="sheet">${ROW(a)}</div>`).join('') +
      '</div>').join('') + '</div>';
  },
  decorate(g, cell, R) {
    /* 箱。外枠と内枠の二重線＝箱の厚み（上から見た縁）。 */
    R.blocks(g.ownerDocument, '.gblk').forEach(b => {
      g.appendChild(el('rect', { x:b.x+1, y:b.y+1.6, width:b.w, height:b.h,
        rx:2, fill:'#9C927C', opacity:.24 }));
      g.appendChild(el('rect', { x:b.x, y:b.y, width:b.w, height:b.h, rx:2,
        fill:'#E4D9C2', stroke:'#BFAF90', 'stroke-width':1.1 }));
      g.appendChild(el('rect', { x:b.x+3, y:b.y+3, width:b.w-6, height:b.h-6,
        rx:1.2, fill:'#F1E9D8', stroke:'#CFC2A5', 'stroke-width':.8 }));
    });
    /* 中の紙。1件＝1枚。 */
    R.blocks(g.ownerDocument, '.sheet').forEach(b => {
      g.appendChild(el('rect', { x:b.x+.8, y:b.y+1, width:b.w, height:b.h,
        rx:.8, fill:'#A2977F', opacity:.22 }));
      g.appendChild(el('rect', { x:b.x, y:b.y, width:b.w, height:b.h, rx:.8,
        fill:'#FFFDF7', stroke:'#E0D8C4', 'stroke-width':.7 }));
    });
  }
}
];

/* ══════════════════════════════════════════════════════════
   ■ 寸法（v22 のまま）。1単位＝10mm。                          */
const W = 1170, TO = 15, TI = 10, OPW = 78, GK = 140;
const VN = Math.round(W * 0.6);
const CW = 110;
const V2 = Math.round((W - CW) * 0.4);
const V3 = V2 + CW;
const V4 = V3 + Math.round((W - V3) * 0.46);
const MINR = 137, MAXR = 1100;

function measure(html, wpx) {
  const d = document.createElement('div');
  d.style.cssText = 'position:absolute;visibility:hidden;left:-9999px;' +
    'font-family:' + getComputedStyle(document.body).fontFamily;
  d.style.width = wpx + 'px';
  d.innerHTML = html;
  document.body.appendChild(d);
  const h = d.getBoundingClientRect().height;
  d.remove();
  return h;
}

function buildPlan(p, stageW, V) {
  const acts = ACTS[p.id] || [];
  const html = { liv: V.html(acts), when: whenHTML(p),
                 right: rightHTML(p), party: partyHTML(p),
                 matter: matterHTML(p), docs: docsHTML(p) };
  const wUnit = {
    liv:    VN - TO/2 - TI/2,
    when:   W - VN - TI/2 - TO/2,
    docs:   V2 - TO/2 - TI/2,
    right:  V4 - V3 - TI/2 - TI/2,
    party:  W - V4 - TI/2 - TO/2,
    matter: W - V3 - TI/2 - TO/2
  };
  const PADIN = 13, HEADPX = 23;
  const u2px = u => u / (W + 20) * stageW;
  const px2u = x => x * (W + 20) / stageW;
  /* 案ごとの内側の余白（物の厚みぶん）。liv だけ広い。 */
  const pad = k => PADIN + (k === 'liv' ? V.inset : 0);
  const toPx = (u, k) => u2px(u - pad(k) * 2);

  const wallY = { liv:[TO, TI], when:[TO, TI], docs:[TI, TO],
                  right:[TI, TI], party:[TI, TI], matter:[TI, TO] };
  const raw = {}, need = {};
  Object.keys(html).forEach(k => {
    raw[k] = measure(html[k], Math.max(50, toPx(wUnit[k], k)));
    const walls = (wallY[k][0] + wallY[k][1]) / 2;
    const head = (k === 'liv' && V.id === 'A') ? 0 : HEADPX;
    const inUnit = px2u(raw[k] + head) + pad(k) * 2 + walls;
    need[k] = Math.min(MAXR, Math.max(MINR, Math.ceil(inUnit)));
  });

  const H1 = Math.max(need.liv, need.when);
  const docsH = need.docs;
  const topH  = Math.max(need.right, need.party);
  const rSum  = topH + need.matter;
  const CORR  = Math.max(docsH, rSum);
  const H     = H1 + CORR;
  const KAMA  = H - GK;
  const toFoot = y => (H - y) < GK ? H : y;
  const Y2 = H1 + topH;

  const rooms = [
    { id:'liv',    label:'今のうち',     kind:'liv',   x1:0,  y1:0,  x2:VN, y2:H1 },
    { id:'when',   label:'そのとき',     kind:'main2', x1:VN, y1:0,  x2:W,  y2:H1 },
    { id:'corr',   label:'',             kind:'corr',  x1:V2, y1:H1, x2:V3, y2:KAMA },
    { id:'gk',     label:'玄関',         kind:'gk',    x1:V2, y1:KAMA, x2:V3, y2:H },
    { id:'docs',   label:'書類',         kind:'room',  x1:0,  y1:H1, x2:V2, y2:H },
    { id:'right',  label:'権利関係',     kind:'room',  x1:V3, y1:H1, x2:V4, y2:Y2 },
    { id:'party',  label:'ローン・契約', kind:'room',  x1:V4, y1:H1, x2:W,  y2:Y2 },
    { id:'matter', label:'事情',         kind:'room',  x1:V3, y1:Y2, x2:W,
      y2: toFoot(H1 + rSum) }
  ];
  return { p, rooms, R:Object.fromEntries(rooms.map(r => [r.id, r])),
           H, KAMA, H1, html, pad, V };
}

/* ── 壁（v22 のまま）───────────────────────────────── */
function sharedEdge(a, b) {
  if (!a || !b) return null;
  if (a.x2 === b.x1 || b.x2 === a.x1) {
    const x = (a.x2 === b.x1) ? a.x2 : b.x2;
    const s = Math.max(a.y1, b.y1), e = Math.min(a.y2, b.y2);
    if (e > s) return { dir:'v', pos:x, a:s, b:e };
  }
  if (a.y2 === b.y1 || b.y2 === a.y1) {
    const y = (a.y2 === b.y1) ? a.y2 : b.y2;
    const s = Math.max(a.x1, b.x1), e = Math.min(a.x2, b.x2);
    if (e > s) return { dir:'h', pos:y, a:s, b:e };
  }
  return null;
}

function draw(plan, host, uid) {
  const { rooms, R, H, KAMA, V } = plan;
  const links = [['liv','when'], ['corr','right'], ['corr','docs'],
                 ['corr','matter'], ['right','party']];
  const NOWALL = [['corr','gk'], ['corr','liv']];
  const openings = links.map(([i, j]) => {
    const e = sharedEdge(R[i], R[j]); if (!e) return null;
    return [e.dir, e.pos, (e.a + e.b) / 2, Math.min(OPW, (e.b - e.a) * 0.7)];
  }).filter(Boolean);
  openings.push(['h', H, (V2 + V3) / 2, V3 - V2 - TI]);
  const nowall = NOWALL.map(([i, j]) => sharedEdge(R[i], R[j])).filter(Boolean);

  const segs = new Map();
  const addSeg = (dir, pos, a, b, outer) => {
    const k = dir+':'+pos+':'+Math.min(a,b)+':'+Math.max(a,b);
    if (!segs.has(k)) segs.set(k, { dir, pos, a:Math.min(a,b), b:Math.max(a,b), outer });
  };
  const covers = (x, y) => rooms.some(o =>
    o.x1 < x - 0.01 && o.x2 > x + 0.01 && o.y1 < y - 0.01 && o.y2 > y + 0.01);
  const isOuter = (dir, pos, a, b) => {
    const m = (a + b) / 2, d = 1;
    return dir === 'h' ? !(covers(m, pos - d) && covers(m, pos + d))
                       : !(covers(pos - d, m) && covers(pos + d, m));
  };
  const th = (dir, pos, a, b) => isOuter(dir, pos, a, b) ? TO : TI;
  rooms.forEach(r => {
    addSeg('h', r.y1, r.x1, r.x2, isOuter('h', r.y1, r.x1, r.x2));
    addSeg('h', r.y2, r.x1, r.x2, isOuter('h', r.y2, r.x1, r.x2));
    addSeg('v', r.x1, r.y1, r.y2, isOuter('v', r.x1, r.y1, r.y2));
    addSeg('v', r.x2, r.y1, r.y2, isOuter('v', r.x2, r.y1, r.y2));
  });
  { const byLine = new Map();
    segs.forEach(s => { const k = s.dir+':'+s.pos;
      if (!byLine.has(k)) byLine.set(k, []); byLine.get(k).push(s); });
    segs.clear();
    byLine.forEach((list, k) => {
      list.sort((a, b) => a.a - b.a);
      let cur = null; const out = [];
      list.forEach(s => {
        if (cur && s.a <= cur.b + 0.01) {
          cur.b = Math.max(cur.b, s.b); cur.outer = cur.outer || s.outer;
        } else { cur = Object.assign({}, s); out.push(cur); }
      });
      out.forEach((s, i) => segs.set(k+':'+i, s));
    });
  }

  const svg = document.createElementNS(NS, 'svg');
  svg.setAttribute('viewBox', `-10 -10 ${W + 20} ${H + 20}`);
  host.appendChild(svg);
  const defs = el('defs');
  const pat = el('pattern', { id:'hw'+uid, width:6, height:6,
    patternTransform:'rotate(45)', patternUnits:'userSpaceOnUse' });
  pat.appendChild(el('line', { x1:0, y1:0, x2:0, y2:6,
    stroke:'#B9B3A4', 'stroke-width':1.1 }));
  defs.appendChild(pat); svg.appendChild(defs);

  const FLOOR = { corr:'#F4F1E7', gk:'#EDE9DC', liv:'#FBF7E9',
                  main2:'#FAF6E8', room:'#FDFCF8' };
  rooms.forEach(r => {
    const x  = r.x1 + th('v', r.x1, r.y1, r.y2) / 2;
    const y  = r.y1 + th('h', r.y1, r.x1, r.x2) / 2;
    const x2 = r.x2 - th('v', r.x2, r.y1, r.y2) / 2;
    const y2 = r.y2 - th('h', r.y2, r.x1, r.x2) / 2;
    svg.appendChild(el('rect', { x, y, width:x2-x, height:y2-y,
      fill: FLOOR[r.kind] || '#FDFCF8' }));
  });

  /* 物を置く層。床の上、壁の下。 */
  const furn = el('g', { class:'furn' });
  svg.appendChild(furn);

  const wallG = el('g', { stroke:'#6E6A60', fill:'url(#hw'+uid+')' });
  function trimEnd(seg, v, dirSign) {
    const cross = seg.dir === 'h' ? 'v' : 'h';
    let hit = null;
    segs.forEach(o => {
      if (o.dir !== cross || o.pos !== v) return;
      if (seg.pos < o.a - 0.01 || seg.pos > o.b + 0.01) return;
      if (!hit || (o.outer && !hit.outer)) hit = o;
    });
    if (!hit) return v;
    return v - dirSign * (hit.outer ? TO : TI) / 2;
  }
  const slabs = [];
  segs.forEach(s => {
    const th = s.outer ? TO : TI;
    const cuts = openings.filter(o => o[0] === s.dir && o[1] === s.pos)
      .map(o => [o[2] - o[3]/2, o[2] + o[3]/2])
      .concat(nowall.filter(e => e.dir === s.dir && e.pos === s.pos)
        .map(e => [e.a, e.b]))
      .filter(o => o[1] > s.a && o[0] < s.b).sort((a, b) => a[0] - b[0]);
    let cur = s.a; const pieces = [];
    cuts.forEach(o => { if (o[0] > cur) pieces.push([cur, o[0]]); cur = Math.max(cur, o[1]); });
    if (cur < s.b) pieces.push([cur, s.b]);
    pieces.forEach(pc => {
      const q0 = trimEnd(s, pc[0], +1), q1 = trimEnd(s, pc[1], -1);
      if (s.dir === 'h') slabs.push([q0, s.pos-th/2, q1-q0, th, s.outer]);
      else               slabs.push([s.pos-th/2, q0, th, q1-q0, s.outer]);
    });
  });
  const EPS = 0.01;
  slabs.forEach(([x, y, w, h]) => wallG.appendChild(el('rect',
    { x, y, width:w, height:h, fill:'#FDFCF8', stroke:'none' })));
  slabs.forEach(([x, y, w, h]) => wallG.appendChild(el('rect',
    { x, y, width:w, height:h, fill:'url(#hw'+uid+')', stroke:'none' })));
  function subtract(a, b, ranges) {
    let out = [[a, b]];
    ranges.forEach(([c, d]) => {
      const next = [];
      out.forEach(([s0, s1]) => {
        if (d <= s0 + EPS || c >= s1 - EPS) { next.push([s0, s1]); return; }
        if (c > s0 + EPS) next.push([s0, c]);
        if (d < s1 - EPS) next.push([d, s1]);
      });
      out = next;
    });
    return out;
  }
  slabs.forEach((sl, idx) => {
    const [x, y, w, h, outer] = sl;
    const sw = outer ? 2 : 1.6;
    const others = slabs.filter((_, k) => k !== idx);
    [y, y + h].forEach(yy => {
      const cov = others.filter(o => o[1] < yy - EPS && o[1] + o[3] > yy + EPS)
        .map(o => [o[0], o[0] + o[2]]);
      subtract(x, x + w, cov).forEach(([s0, s1]) => {
        if (s1 - s0 > EPS) wallG.appendChild(el('line',
          { x1:s0, y1:yy, x2:s1, y2:yy, 'stroke-width':sw }));
      });
    });
    [x, x + w].forEach(xx => {
      const cov = others.filter(o => o[0] < xx - EPS && o[0] + o[2] > xx + EPS)
        .map(o => [o[1], o[1] + o[3]]);
      subtract(y, y + h, cov).forEach(([s0, s1]) => {
        if (s1 - s0 > EPS) wallG.appendChild(el('line',
          { x1:xx, y1:s0, x2:xx, y2:s1, 'stroke-width':sw }));
      });
    });
  });
  svg.appendChild(wallG);
  svg.appendChild(el('line', { x1:V2+TI/2, y1:KAMA, x2:V3-TI/2, y2:KAMA,
    stroke:'#B9B3A4', 'stroke-width':1.6 }));
  const gkT = el('text', { x:(V2+V3)/2, y:(KAMA+H)/2, 'text-anchor':'middle',
    'dominant-baseline':'middle', 'font-size':16, fill:'#8C8779',
    'font-family':'system-ui, sans-serif' });
  gkT.textContent = '玄関'; svg.appendChild(gkT);

  const layer = document.createElement('div');
  layer.className = 'layer'; host.appendChild(layer);
  const VBW = W + 20, VBH = H + 20;
  rooms.forEach(r => {
    if (!plan.html[r.id]) return;
    const pad = plan.pad(r.id);
    const d = document.createElement('div');
    d.className = 'cell'; d.dataset.id = r.id;
    const x1 = r.x1 + th('v', r.x1, r.y1, r.y2) / 2 + pad;
    const y1 = r.y1 + th('h', r.y1, r.x1, r.x2) / 2 + pad;
    const x2 = r.x2 - th('v', r.x2, r.y1, r.y2) / 2 - pad;
    const y2 = r.y2 - th('h', r.y2, r.x1, r.x2) / 2 - pad;
    d.style.left   = ((x1 + 10) / VBW * 100) + '%';
    d.style.top    = ((y1 + 10) / VBH * 100) + '%';
    d.style.width  = ((x2 - x1) / VBW * 100) + '%';
    d.style.height = ((y2 - y1) / VBH * 100) + '%';
    d.innerHTML = `<h4>${esc(r.label)}</h4><div class="body">${plan.html[r.id]}</div>`;
    layer.appendChild(d);
  });

  /* ── 物を描く。字を置いたあとに、その実測位置へ。
     ここが「座標を勘で置かない」ための仕掛け ―― 紙や箱の大きさは
     中身が決めるので、スクショを見ながら px を詰める作業が要らない。 */
  const livCell = layer.querySelector('.cell[data-id=liv]');
  const planBox = host.getBoundingClientRect();
  const toU = r => ({
    x: (r.left - planBox.left) / planBox.width * VBW - 10,
    y: (r.top  - planBox.top)  / planBox.height * VBH - 10,
    w: r.width  / planBox.width  * VBW,
    h: r.height / planBox.height * VBH
  });
  const R2 = {
    expand: (b, n) => ({ x:b.x-n, y:b.y-n, w:b.w+n*2, h:b.h+n*2 }),
    blocks: (doc, sel) => Array.from(livCell.querySelectorAll(sel))
      .map(e => toU(e.getBoundingClientRect()))
  };
  V.decorate(furn, toU(livCell.getBoundingClientRect()), R2);
  return layer;
}

/* ══════════════════════════════════════════════════════════
   ■ 実行。p1 の間取りを、3案ぶん並べる。                       */
const out = document.getElementById('out');
const p = S.all()[0];
VARIANTS.forEach((V, i) => {
  const h2 = document.createElement('h2');
  h2.innerHTML = `案${V.id}｜${esc(V.name)} <span>${esc(V.desc)}</span>`;
  out.appendChild(h2);
  const st = document.createElement('div');
  st.className = 'stage ' + V.id;
  out.appendChild(st);
  const d = document.createElement('div'); d.className = 'plan';
  st.appendChild(d);
  const plan = buildPlan(p, d.getBoundingClientRect().width, V);
  draw(plan, d, i);
});
</script>
</body>
