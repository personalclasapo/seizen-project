<html lang="ja">
<head>
<meta charset="utf-8">

<title>不動産｜間取り（中身入り）v14</title>
<link rel="stylesheet" href="../prototype/shared/tokens.css">
<style>
  body{margin:0;background:var(--page);font-family:var(--font);color:var(--ink);
    padding:28px 20px 60px}
  .wrap{max-width:1240px;margin:0 auto}
  h1{font-size:19px;margin:0 0 6px}
  .lead{font-size:12.5px;color:var(--ink2);margin:0 0 24px;line-height:1.85}
  .lead b{color:var(--ink)}
  h2{font-size:14px;margin:34px 0 4px;display:flex;align-items:baseline;gap:10px}
  h2 span{font-size:11.5px;font-weight:400;color:var(--ink3)}
  .stage{background:var(--card);border:1px solid var(--line);border-radius:10px;
    padding:18px;margin-top:10px}
  .note{font-size:12px;color:var(--ink2);margin:12px 0 0;line-height:1.85}
  .note b{color:var(--ink)}
  table{border-collapse:collapse;font-size:11.5px;margin-top:10px;width:100%}
  th,td{border:1px solid var(--line);padding:6px 9px;text-align:left;
    vertical-align:top;line-height:1.7}
  th{background:var(--paper2);font-weight:600;color:var(--ink2)}
  td.n{text-align:right;font-variant-numeric:tabular-nums}
  .ok{color:var(--gr);font-weight:700}
  .ng{color:var(--or);font-weight:700}

  /* ── 間取り本体 ────────────────────────────
     壁は SVG（造形）、中身は HTML（配置）。CLAUDE.md の
     「SVG は物の形、CSS は物の配置」に沿う。            */
  .plan{position:relative;width:100%;max-width:1100px;margin:0 auto}
  .plan svg{display:block;width:100%;height:auto}
  .layer{position:absolute;inset:0}
  .cell{position:absolute;overflow:hidden;display:flex;flex-direction:column}
  .cell > h4{font-size:11.5px;margin:0 0 5px;color:var(--ink2);font-weight:600;
    letter-spacing:.04em;flex:none;
    display:flex;align-items:baseline;gap:6px}
  .cell > h4 .cnt{font-size:10px;color:var(--ink3);font-weight:400}
  .body{flex:1;overflow-y:auto;min-height:0}
  .body::-webkit-scrollbar{width:4px}
  .body::-webkit-scrollbar-thumb{background:#DCD6C8;border-radius:2px}

  .r{padding:5px 0;border-top:1px solid #EFEBE0;font-size:11.5px;line-height:1.7}
  .r:first-child{border-top:0}
  .r .lb{color:var(--ink3);font-size:10.5px}
  .bdg{display:inline-block;font-size:10px;padding:0 5px;border-radius:3px;
    border:1px solid var(--line);color:var(--ink2);background:var(--paper2);
    margin-left:4px;white-space:nowrap}
  .bdg.or{color:#9A6A2F;border-color:#E2CDA8;background:#FBF3E5}
  .bdg.gr{color:#4E7A54;border-color:#C6DCC8;background:#F0F6F0}
  .bdg.gy{color:var(--ink3)}
  .dt{display:flex;flex-wrap:wrap;gap:1px 12px;margin-top:2px}
  .dt span{font-size:10.5px;color:var(--ink2)}
  .dt b{font-weight:400;color:var(--ink3)}
  .memo{font-size:11px;color:var(--ink2);line-height:1.65;margin-top:1px}

  /* 家族がすること＝主役。種別で区切る */
  .grp{font-size:10px;color:var(--ink3);margin:7px 0 2px;letter-spacing:.06em}
  .grp:first-child{margin-top:0}
  .act{padding:4px 0;font-size:12px;line-height:1.7;
    border-top:1px solid #EFEBE0}
  .act b{font-weight:600}
  .act .sub{color:var(--ink2);font-size:11px}
  .cell.main .act{font-size:12.5px}
</style>

<body>
<div class="wrap">

<h1>不動産・住まい｜間取り（中身入り）v14</h1>
<p class="lead">
  v13 までは<b>部屋の名前しか入っていない枠</b>を見て寸法を議論していた。
  だから「書類が契約より上にある」「ローンが主役より大きい」といった、
  図を見れば一目で分かることを数字で追っていた。<br>
  ここでは<b>実際の中身を間取りの中に入れる</b>。
  壁は SVG（物の形）、中身は HTML（物の配置）。
</p>

<h2>1. 間取り <span>自宅／中身入り・実寸</span></h2>
<div class="stage">
  <div class="plan" id="plan"></div>
  <p class="note" id="planNote"></p>
</div>

<h2>2. v13 から直したこと</h2>
<div class="stage">

<script src="../prototype/real-estate/state.js"></script>
<script>
const S = window.SeiZenRealEstate;
const p = S.all()[0];
const esc = s => String(s == null ? '' : s)
  .replace(/&/g,'&amp;').replace(/</g,'&lt;');

/* ══════════════════════════════════════════════════════════
   ■ 中身。_検討/中身の実測.html と同じもの。            */
function livHTML() {
  const acts = [
    ['連絡', '○○管理株式会社', '管理費の引き落とし口座を変更する', '045-123-4567'],
    ['連絡', '○○銀行 青葉台支店', '団信の手続きを申し出る', ''],
    ['連絡', '西隣の◇◇さん', '境界の話が途中のままになっている', ''],
    ['引継', '建物管理の契約', '管理費・修繕積立金 月12,000円（毎月27日）', ''],
    ['確認', '土地の名義', '父のまま。兄弟3人が相続人', ''],
    ['確認', '北側の増築部分', '未登記。確認申請の有無も不明', ''],
    ['手続', '相続登記', '土地の名義を本人へ', ''],
    ['手続', 'ローンの完済', '団信により完済される見込み', '']
  ];
  const GN = { 連絡:'誰に連絡するか', 引継:'何を引き継ぐか',
               確認:'何を確認するか', 手続:'何を手続きするか' };
  let out = '', cur = '';
  acts.forEach(a => {
    if (a[0] !== cur) { cur = a[0]; out += `<div class="grp">${esc(GN[cur])}</div>`; }
    out += `<div class="act"><b>${esc(a[1])}</b>　` +
      `<span class="sub">${esc(a[2])}</span>` +
      (a[3] ? `<span class="bdg">${esc(a[3])}</span>` : '') + '</div>';
  });
  return out;
}
function matterHTML() {
  return Object.keys(p.matters).map(k => {
    const m = p.matters[k], f = S.FINDINGS[m.find];
    const tone = m.find === 'no' ? 'gy' : 'or';
    let h = `<div class="r">${esc(S.MATTERS[k].label)}` +
            `<span class="bdg ${tone}">${esc(f.label)}</span>`;
    if (m.memo) h += `<div class="memo">${esc(m.memo)}</div>`;
    if (m.detail) {
      const d = m.detail, pairs = [];
      if (d.who)   pairs.push(['相手', d.who]);
      if (d.deal)  pairs.push(['取り決め', d.deal]);
      if (d.paper) pairs.push(['書面', d.paper]);
      if (d.reg)   pairs.push(['登記', d.reg]);
      if (d.state) pairs.push(['状況', d.state]);
      h += '<div class="dt">' + pairs.map(x =>
        `<span><b>${esc(x[0])}</b> ${esc(x[1])}</span>`).join('') + '</div>';
    }
    return h + '</div>';
  }).join('');
}
function rightHTML() {
  return ['land', 'bldg'].map(k => {
    const r = p.rights[k], mt = S.MATCH[r.match];
    return `<div class="r"><span class="lb">${k === 'land' ? '土地' : '建物'}</span> ` +
      esc(r.owner) + (r.shares ? `<span class="bdg gy">${esc(r.shares)}</span>` : '') +
      `<span class="bdg ${mt.tone === 'gr' ? 'gr' : 'or'}">登記と${esc(mt.label)}</span>` +
      (r.memo ? `<div class="memo">${esc(r.memo)}</div>` : '') + '</div>';
  }).join('');
}
function dealHTML() {
  return (p.deals || []).map(d =>
    `<div class="r"><span class="bdg">${esc(S.DEALS[d.kind].label)}</span> ` +
    esc(d.who) + `<div class="memo">${esc(d.what)}</div>` +
    `<div class="dt"><span><b>連絡先</b> ${esc(d.tel)}</span></div></div>`).join('');
}
function loanHTML() {
  const l = p.loan;
  if (!l.has) return '<div class="r">借入なし<span class="bdg gy">該当なし</span></div>';
  return `<div class="r"><span class="lb">借入</span> ${esc(l.bank)}` +
    `<div class="dt"><span><b>種類</b> ${esc(l.type)}</span>` +
    `<span><b>借りている人</b> ${esc(l.debtor)}</span></div></div>` +
    `<div class="r"><span class="lb">団信</span> ${esc(l.gtee)}</div>` +
    `<div class="r"><span class="lb">担保</span> ${esc(l.mortgage)}` +
    `<div class="dt"><span><b>他の借入の担保</b> ${esc(l.cross)}</span></div></div>`;
}
function docsHTML() {
  return S.neededDocs(p).map(d => {
    const st = S.ST[d.st];
    const tone = d.st === 'done' ? 'gr' : (d.st === 'none' ? 'gy' : 'or');
    return `<div class="r">${esc(d.label)}` +
      `<span class="bdg ${tone}">${esc(st ? st.label : d.st)}</span></div>`;
  }).join('');
}

/* ══════════════════════════════════════════════════════════
   ■ 寸法。1単位＝10mm。

   v13 から直した点：
   1. 書類の幅を削った。実測で「幅を広げても高さが変わらない」＝
      短い行なので広い幅が要らない。左列を細くし、その分リビングへ。
   2. 廊下沿いの順を「家族が動く順」に戻した。
      相手に連絡する（契約）が先、行動のとき見る索引（書類）が後。
      左右のバランスより順序の意味を優先する。
   3. 主役が負けないよう、上段の深さを実測ではなく
      「主役として要る大きさ」から取る。                    */
const W   = 1170;
const TO  = 15, TI = 10;
const OPW = 78;
const GK  = 140;

/* 左列は書類・契約。短い行しか入らないので細い。
   右列は権利・ローン。ラベル＋値＋メモが入るので左より広い。 */
const V2 = 330, V3 = 440;      /* 廊下の左右（幅1100mm） */

const H1 = 560;                /* 上段の深さ。主役が要る大きさ */
const VN = 800;                /* リビングと事情の境 */

/* 廊下沿いの4室。順は家族が動く順（上から）。
   右：権利関係 → ローン・担保（物件に付いているもの）
   左：契約・やり取り → 書類（動くときに要るもの）        */
const SLOTS = {
  L: [ { id:'deal', label:'契約・やり取り', h:300 },
       { id:'docs', label:'書類',           h:420 } ],
  R: [ { id:'right', label:'権利関係',     h:330 },
       { id:'loan',  label:'ローン・担保', h:390 } ]
};
const CORR = SLOTS.L.reduce((a, s) => a + s.h, 0);
const KAMA = H1 + CORR;
const H    = KAMA + GK;

const rooms = [
  { id:'liv',   label:'家族がすること', kind:'liv',  x1:0,  y1:0, x2:VN, y2:H1 },
  { id:'matter',label:'事情',           kind:'main2',x1:VN, y1:0, x2:W,  y2:H1 },
  { id:'corr',  label:'',               kind:'corr', x1:V2, y1:H1, x2:V3, y2:KAMA },
  { id:'gk',    label:'玄関',           kind:'gk',   x1:V2, y1:KAMA, x2:V3, y2:H }
];
[['L', 0, V2], ['R', V3, W]].forEach(([side, x1, x2]) => {
  let y = H1;
  SLOTS[side].forEach((s, i) => {
    const last = (i === SLOTS[side].length - 1);
    const y2 = last ? H : y + s.h;
    rooms.push({ id:s.id, label:s.label, kind:'room', x1, x2, y1:y, y2:y2 });
    y = y2;
  });
});
const R = Object.fromEntries(rooms.map(r => [r.id, r]));

const CONTENT = { liv:livHTML, matter:matterHTML, right:rightHTML,
                  deal:dealHTML, loan:loanHTML, docs:docsHTML };
const COUNT = { liv:8, matter:3, right:2, deal:(p.deals||[]).length,
                loan:3, docs:S.neededDocs(p).length };

/* ── 壁（v13 と同じ生成） ─────────────────── */
function sharedEdge(a, b) {
  if (!a || !b) return null;
  if (a.x2 === b.x1 || b.x2 === a.x1) {
    const x = (a.x2 === b.x1) ? a.x2 : b.x2;
    const s = Math.max(a.y1, b.y1), e = Math.min(a.y2, b.y2);
    if (e > s) return { dir:'v', pos:x, a:s, b:e };
  }
  if (a.y2 === b.y1 || b.y2 === a.y1) {
    const y = (a.y2 === b.y1) ? a.y2 : b.y2;
    const s = Math.max(a.x1, b.x1), e = Math.min(a.x2, b.x2);
    if (e > s) return { dir:'h', pos:y, a:s, b:e };
  }
  return null;
}
const links = rooms.filter(r => r.kind === 'room').map(r => ['corr', r.id]);
links.push(['liv', 'matter']);
const NOWALL = [['corr','gk'], ['corr','liv']];
const openings = links.map(([i, j]) => {
  const e = sharedEdge(R[i], R[j]); if (!e) return null;
  return [e.dir, e.pos, (e.a + e.b) / 2, Math.min(OPW, (e.b - e.a) * 0.7)];
}).filter(Boolean);
openings.push(['h', H, (V2 + V3) / 2, V3 - V2 - TI]);
const nowall = NOWALL.map(([i, j]) => sharedEdge(R[i], R[j])).filter(Boolean);

const segs = new Map();
const addSeg = (dir, pos, a, b, outer) => {
  const k = dir+':'+pos+':'+Math.min(a,b)+':'+Math.max(a,b);
  if (!segs.has(k)) segs.set(k, { dir, pos, a:Math.min(a,b), b:Math.max(a,b), outer });
};
rooms.forEach(r => {
  addSeg('h', r.y1, r.x1, r.x2, r.y1 === 0);
  addSeg('h', r.y2, r.x1, r.x2, r.y2 === H);
  addSeg('v', r.x1, r.y1, r.y2, r.x1 === 0);
  addSeg('v', r.x2, r.y1, r.y2, r.x2 === W);
});
{ const byLine = new Map();
  segs.forEach(s => { const k = s.dir+':'+s.pos;
    if (!byLine.has(k)) byLine.set(k, []); byLine.get(k).push(s); });
  segs.clear();
  byLine.forEach((list, k) => {
    list.sort((a, b) => a.a - b.a);
    let cur = null; const out = [];
    list.forEach(s => {
      if (cur && s.a <= cur.b + 0.01) {
        cur.b = Math.max(cur.b, s.b); cur.outer = cur.outer || s.outer;
      } else { cur = Object.assign({}, s); out.push(cur); }
    });
    out.forEach((s, i) => segs.set(k+':'+i, s));
  });
}

const NS = 'http://www.w3.org/2000/svg';
const el = (n, a) => { const e = document.createElementNS(NS, n);
  for (const k in a) e.setAttribute(k, a[k]); return e; };

const host = document.getElementById('plan');
const svg = document.createElementNS(NS, 'svg');
svg.setAttribute('viewBox', `-10 -10 ${W + 20} ${H + 20}`);
host.appendChild(svg);

const defs = el('defs');
const pat = el('pattern', { id:'hw', width:6, height:6,
  patternTransform:'rotate(45)', patternUnits:'userSpaceOnUse' });
pat.appendChild(el('line', { x1:0, y1:0, x2:0, y2:6,
  stroke:'#B9B3A4', 'stroke-width':1.1 }));
defs.appendChild(pat); svg.appendChild(defs);

const FLOOR = { corr:'#F4F1E7', gk:'#EDE9DC', liv:'#FBF7E9',
                main2:'#FAF6E8', room:'#FDFCF8' };
rooms.forEach(r => {
  const x  = r.x1 + (r.x1 === 0 ? TO : TI) / 2;
  const y  = r.y1 + (r.y1 === 0 ? TO : TI) / 2;
  const x2 = r.x2 - (r.x2 === W ? TO : TI) / 2;
  const y2 = r.y2 - (r.y2 === H ? TO : TI) / 2;
  svg.appendChild(el('rect', { x, y, width:x2-x, height:y2-y,
    fill: FLOOR[r.kind] || '#FDFCF8' }));
});

const wallG = el('g', { stroke:'#6E6A60', fill:'url(#hw)' });
function trimEnd(seg, v, dirSign) {
  const cross = seg.dir === 'h' ? 'v' : 'h';
  let hit = null;
  segs.forEach(o => {
    if (o.dir !== cross || o.pos !== v) return;
    if (seg.pos < o.a - 0.01 || seg.pos > o.b + 0.01) return;
    if (!hit || (o.outer && !hit.outer)) hit = o;
  });
  if (!hit) return v;
  return v - dirSign * (hit.outer ? TO : TI) / 2;
}
const slabs = [];
segs.forEach(s => {
  const th = s.outer ? TO : TI;
  const cuts = openings.filter(o => o[0] === s.dir && o[1] === s.pos)
    .map(o => [o[2] - o[3]/2, o[2] + o[3]/2])
    .concat(nowall.filter(e => e.dir === s.dir && e.pos === s.pos)
      .map(e => [e.a, e.b]))
    .filter(o => o[1] > s.a && o[0] < s.b).sort((a, b) => a[0] - b[0]);
  let cur = s.a; const pieces = [];
  cuts.forEach(o => { if (o[0] > cur) pieces.push([cur, o[0]]); cur = Math.max(cur, o[1]); });
  if (cur < s.b) pieces.push([cur, s.b]);
  pieces.forEach(pc => {
    const q0 = trimEnd(s, pc[0], +1), q1 = trimEnd(s, pc[1], -1);
    if (s.dir === 'h') slabs.push([q0, s.pos-th/2, q1-q0, th, s.outer]);
    else               slabs.push([s.pos-th/2, q0, th, q1-q0, s.outer]);
  });
});
const EPS = 0.01;
slabs.forEach(([x, y, w, h]) => wallG.appendChild(el('rect',
  { x, y, width:w, height:h, fill:'#FDFCF8', stroke:'none' })));
slabs.forEach(([x, y, w, h]) => wallG.appendChild(el('rect',
  { x, y, width:w, height:h, fill:'url(#hw)', stroke:'none' })));
function subtract(a, b, ranges) {
  let out = [[a, b]];
  ranges.forEach(([c, d]) => {
    const next = [];
    out.forEach(([s0, s1]) => {
      if (d <= s0 + EPS || c >= s1 - EPS) { next.push([s0, s1]); return; }
      if (c > s0 + EPS) next.push([s0, c]);
      if (d < s1 - EPS) next.push([d, s1]);
    });
    out = next;
  });
  return out;
}
slabs.forEach((sl, idx) => {
  const [x, y, w, h, outer] = sl;
  const sw = outer ? 2 : 1.6;
  const others = slabs.filter((_, k) => k !== idx);
  [y, y + h].forEach(yy => {
    const cov = others.filter(o => o[1] < yy - EPS && o[1] + o[3] > yy + EPS)
      .map(o => [o[0], o[0] + o[2]]);
    subtract(x, x + w, cov).forEach(([s0, s1]) => {
      if (s1 - s0 > EPS) wallG.appendChild(el('line',
        { x1:s0, y1:yy, x2:s1, y2:yy, 'stroke-width':sw }));
    });
  });
  [x, x + w].forEach(xx => {
    const cov = others.filter(o => o[0] < xx - EPS && o[0] + o[2] > xx + EPS)
      .map(o => [o[1], o[1] + o[3]]);
    subtract(y, y + h, cov).forEach(([s0, s1]) => {
      if (s1 - s0 > EPS) wallG.appendChild(el('line',
        { x1:xx, y1:s0, x2:xx, y2:s1, 'stroke-width':sw }));
    });
  });
});
svg.appendChild(wallG);
svg.appendChild(el('line', { x1:V2+TI/2, y1:KAMA, x2:V3-TI/2, y2:KAMA,
  stroke:'#B9B3A4', 'stroke-width':1.6 }));
/* 玄関のラベル。カギはここを押すとポップアップ（実装は別途） */
const gkT = el('text', { x:(V2+V3)/2, y:(KAMA+H)/2, 'text-anchor':'middle',
  'dominant-baseline':'middle', 'font-size':17, fill:'#8C8779',
  'font-family':'system-ui, sans-serif' });
gkT.textContent = '玄関'; svg.appendChild(gkT);

/* ── 中身を重ねる（HTML層）──────────────────
   SVG の viewBox と同じ比率で絶対配置する。            */
const layer = document.createElement('div');
layer.className = 'layer';
host.appendChild(layer);
const VBX = -10, VBY = -10, VBW = W + 20, VBH = H + 20;
const PADIN = 16;                 /* 部屋の内側の余白（単位系） */
rooms.forEach(r => {
  if (!CONTENT[r.id]) return;
  const d = document.createElement('div');
  d.className = 'cell' + (r.id === 'liv' ? ' main' : '');
  const x1 = r.x1 + (r.x1 === 0 ? TO : TI) / 2 + PADIN;
  const y1 = r.y1 + (r.y1 === 0 ? TO : TI) / 2 + PADIN;
  const x2 = r.x2 - (r.x2 === W ? TO : TI) / 2 - PADIN;
  const y2 = r.y2 - (r.y2 === H ? TO : TI) / 2 - PADIN;
  d.style.left   = ((x1 - VBX) / VBW * 100) + '%';
  d.style.top    = ((y1 - VBY) / VBH * 100) + '%';
  d.style.width  = ((x2 - x1) / VBW * 100) + '%';
  d.style.height = ((y2 - y1) / VBH * 100) + '%';
  d.innerHTML = `<h4>${esc(r.label)}` +
    `<span class="cnt">${COUNT[r.id]}</span></h4>` +
    `<div class="body">${CONTENT[r.id]()}</div>`;
  layer.appendChild(d);
});

/* ── 検証 ───────────────────────────────── */
const tsubo = r => (r.x2-r.x1) * (r.y2-r.y1) / 100 / 3.3;
const roomsOnly = rooms.filter(r => r.kind === 'room');
const livT = tsubo(R.liv), matT = tsubo(R.matter);
const maxRoom = Math.max(...roomsOnly.map(tsubo));
const row = (a, b, ok) => `<tr><td>${a}</td><td>${b}</td>` +
  `<td class="${ok?'ok':'ng'}">${ok?'○':'✗'}</td></tr>`;

/* 中身が部屋に収まっているか（スクロールが出ていないか）を実測する。
   収まらない部屋は、溢れの受け方で扱うと決めたもの以外は破れ。  */
requestAnimationFrame(() => {
  const over = [];
  layer.querySelectorAll('.cell').forEach(c => {
    const b = c.querySelector('.body');
    if (b.scrollHeight > b.clientHeight + 2)
      over.push(c.querySelector('h4').childNodes[0].textContent.trim());
  });
  document.getElementById('chk').innerHTML =
    '<tr><th>確認</th><th>値</th><th>判定</th></tr>' +
    row('<b>リビングが最大か</b>',
        `リビング ${livT.toFixed(0)} ／ 次点 ${Math.max(matT, maxRoom).toFixed(0)}`,
        livT > Math.max(matT, maxRoom)) +
    row('<b>事情が個室より大きいか</b>',
        `事情 ${matT.toFixed(0)} ／ 個室の最大 ${maxRoom.toFixed(0)}`,
        matT > maxRoom) +
    row('<b>ローンがリビングより小さいか</b>',
        `ローン ${tsubo(R.loan).toFixed(0)} ／ リビング ${livT.toFixed(0)}`,
        tsubo(R.loan) < livT) +
    row('<b>書類の幅が過剰でないか</b>',
        `書類 ${(V2*10)}mm ／ 右列 ${((W-V3)*10)}mm`, V2 < W - V3) +
    row('<b>廊下の順が動く順か</b>',
        '左 契約→書類 ／ 右 権利→ローン', true) +
    row('中身が部屋に収まっているか',
        over.length ? '溢れ: ' + over.join('、') : 'すべて収まった',
        over.length === 0);
});

document.getElementById('fix').innerHTML =
  '<tr><th>v13 の問題</th><th>原因</th><th>直し方</th></tr>' +
  [['書類が左列の全幅を取っていた',
    '実測で「幅を広げても高さが変わらない」＝短い行しか入らないのに、' +
    '左右のバランスだけで幅を決めていた',
    `左列を細くした（${V2*10}mm）。右列は ${(W-V3)*10}mm`],
   ['書類が契約より上にあった',
    '左右の合計が近くなる組み合わせだけで並べ、順序の意味を捨てていた',
    '廊下を辿る順＝家族が動く順に戻した。相手に連絡する（契約）が先、' +
    '行動のとき見る索引（書類）が後'],
   ['ローン・担保が主役より大きかった',
    '上段は左右に並ぶため深さを共有するのに、下段の個室は縦に積めるので' +
    '中身の多い部屋が深くなれた',
    '上段の深さを実測ではなく「主役として要る大きさ」から取った'],
   ['中身が入っていなかった',
    '部屋の名前だけの枠を見て寸法を議論していた',
    '実際の中身を間取りの中に入れた（この図）']]
  .map(r => `<tr><td><b>${esc(r[0])}</b></td><td>${esc(r[1])}</td>` +
    `<td>${esc(r[2])}</td></tr>`).join('');

document.getElementById('planNote').innerHTML =
  `外形 ${W*10}×${H*10}mm。<b>壁は SVG、中身は HTML。</b>` +
  '部屋に入りきらないものはその部屋の中でスクロールする（建物は伸びない）。' +
  '<b>カギは玄関を押すとポップアップ</b>（実装は別途）。' +
  '基本情報は屋根＝外観に入る（この図には未実装）。';
</script>
</body>
</html>
