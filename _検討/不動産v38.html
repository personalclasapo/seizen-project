<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>不動産v38｜土地の見出し（公図の帯）と紙面</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../prototype/shared/tokens.css">
  <link rel="stylesheet" href="../prototype/shared/shell.css">
  <link rel="stylesheet" href="../prototype/real-estate/area.css?v=v38">
  <!--
    不動産v38｜土地（建物の無い土地）の器（2026-10-01）

    本番（prototype/real-estate）の CSS・state.js・editor.js を読み、render.js だけ写し
    （不動産v38.render.js）を使う。変えたのは土地のときだけ。
    項目と判定は `設計/不動産・住まい/土地_調査と項目.md`（§2-4 部屋ごとの整理、§3 器）。

    ■ 見出し＝公図の帯（屋根・上の階にあたる）
      法務省の登記所備付地図データ（東筑摩郡山形村）から切り出した実在の地割り
      （不動産v38.kozu.js。地番は捨てた）。札（トレペ）を中心に重ねる。右端に方位。
      土地の種類によらず同じ1本（田畑の地割り）。筆は塗らない（どの筆が父の土地かは分からない）。
      出典：「登記所備付地図データ 東筑摩郡山形村」（法務省）
      https://www.geospatial.jp/ckan/dataset/houmusyouchizu-2026-1-981 を加工して作成（2026年10月1日に利用）

    ■ 本体＝公図の紙面
      部屋＝筆。仕切りは細い線（筆界）、父の土地の外周は太い線。
      真ん中に通していた道は外した（部屋どうしの関係を言わず、1倍では溝にしか見えなかった）。
      外周の外の水路の帯も外した（そのときの土地改良区のカードの言い直しで、紙面のいちばん下にあった）。
      紙の余白に、隣の筆の境が紙の端まで続く線。床の色は戸建てと同じ。
      左＝今のうち → 名義 → 契約 → 書類、右＝そのとき（割りはマンションと同じ 0.45）。

    ■ 仮データ（画面の上だけ。保存しない）
      1件目 自宅（戸建て、本番のまま。1倍で並べて比べる用）
      2件目 長野の田んぼ：田・畑／○○土地改良区の地区／近所の人が口約束で耕作（賃料あり）／前の代の名義が残る／登記の住所が違う
      3件目 裏山：山林／誰も使っていない
  -->
  <style>
    /* 公図の帯 */
    .kz-paper{fill:#FFFFFF}
    .kz-lot{fill:none;stroke:#7A7568;stroke-width:.8;stroke-linejoin:round}
    .kz-edge{fill:none;stroke:#6E6A60;stroke-width:1.4}
    .kz-n-bg{fill:#FFFFFF;stroke:#A9A292;stroke-width:.8}
    .kz-n{fill:#4E4B43}
    .kz-n-t{font:700 8px var(--font);fill:#4E4B43}
    /* 公図の紙面 */
    .kz-plan{filter:none}
    .kz-sheet{fill:#FFFFFF}
    .kz-nb line{stroke:#A9A292;stroke-width:1.1}
    .kz-in line{stroke:#8C8779;stroke-width:1.2}
    .kz-own .pl-w-line{stroke:#4E4B43}
    .kz-road{font-size:16px;fill:#6E6A60;font-family:var(--font);letter-spacing:.1em}
    .kz-road-s{font-size:13px;fill:#8C8779;letter-spacing:0}
  </style>
</head>
<body data-area="real-estate" data-root="../prototype/">
<div class="shell">
  <aside class="guide"></aside>
  <main class="work"><div class="inner">

    <div class="sec-h">
      <span class="sec-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M3.5 11.5 12 4.2l8.5 7.3"/><path d="M5.8 10.8V19a1 1 0 0 0 1 1h10.4a1 1 0 0 0 1-1v-8.2"/><path d="M9.8 20v-5.4a1 1 0 0 1 1-1h2.4a1 1 0 0 1 1 1V20"/></svg></span>
      <h3>持っている不動産</h3><span class="cnt" id="cntShelf"></span>
      <button class="addbtn" id="addProp">＋ 物件を登録</button>
    </div>
    <p class="sec-lead">自宅・実家・土地など、名義や持分に関わる不動産を並べています。</p>
    <div class="sec"><div class="shelf" id="shelf"></div></div>

    <div class="sec"><div id="plans"></div></div>

  </div></main>
</div>
<div class="toast" id="toast"></div>
<script>
  /* 本番の保存先には書かない（このページで触っても本番の記録が変わらないように）。 */
  (function () {
    const set = Storage.prototype.setItem;
    Storage.prototype.setItem = function (k, v) { if (k === 'SeiZenRealEstate.props') return; return set.call(this, k, v); };
  })();
</script>
<script src="../prototype/shared/areas.js"></script>
<script src="../prototype/shared/shell.js"></script>
<script src="../prototype/real-estate/state.js?v=v38"></script>
<script src="不動産v38.kozu.js?v=v38"></script>
<script>
  /* 画面の上だけで物件を並べ替える：自宅（戸建て）＋土地2件。 */
  (function () {
    const R = window.SeiZenRealEstate, C = o => JSON.parse(JSON.stringify(o));
    const props = R.all();
    const house = C(props.find(p => p.id === 'p1') || props[0]);
    const WHO = '父';
    Object.assign(R.USES, { idle: { label: '誰も使っていない', tone: 'or' } });
    const prNo = { remains: 'no', parcels: [], died: 'unknown', stage: 'none', taker: '', takerName: '' };
    const prYes = { remains: 'yes', parcels: ['land'], owner: '祖父 正一（故人）', rel: 'parent', route: 'split', died: 'before', stage: 'none', taker: 'self', takerName: '' };
    const land = (id, name, o) => Object.assign({
      id, name, kind: 'land', landUse: 'field', use: 'others',
      addr: '長野県上伊那郡○○村 大字○○', note: '',
      rights: { land: { hold: 'own', owner: WHO, shares: '単独', match: 'unknown', st: 'todo', reach: 'public', memo: '' } },
      deals: [], matters: {}, priorInheritance: C(prNo), addrReg: 'unknown',
      loan: { has: 'no', items: [], reach: 'public', memo: '' },
      ownerReport: { state: 'needed', deadline: '' },
      access: { who: '', key: '', keyKind: '', code: '', how: '', st: 'todo', reach: 'onlyself' },
      docs: { place: '', at: { deed: { st: 'unknown', place: '' }, acquire: { st: 'unknown', place: '' } }, st: 'todo' }
    }, o);
    props.splice(0, props.length,
      house,
      land('L1', '長野の田んぼ', { addrReg: 'differ', kairyo: 'yes', kairyoName: '○○土地改良区', priorInheritance: C(prYes),
        deals: [{ kind: 'lend', who: '田中 一男さん（近所）', tel: '0265-00-0000', what: '田を耕作してもらっている', flow: 'recv', farm: 'verbal', paper: 'none', st: 'done' }] }),
      land('L2', '裏山', { landUse: 'forest', use: 'idle', addr: '長野県上伊那郡○○村 大字○○ 字東山' })
    );
    props.forEach(p => { if (p.loan) p.loan.st = p.loan.has === 'no' ? 'none' : 'todo'; });
    R.save = function () {};
  })();
</script>
<script src="../prototype/real-estate/editor.js?v=v38"></script>
<script src="不動産v38.render.js?v=v38"></script>
</body>
</html>
