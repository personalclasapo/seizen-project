<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>不動産v34｜間取りに窓を入れる</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../prototype/shared/tokens.css">
  <link rel="stylesheet" href="../prototype/shared/shell.css">
  <link rel="stylesheet" href="../prototype/real-estate/area.css?v=v34">
  <!--
    不動産v34｜間取りに窓を入れる（2026-09-29）

    本番（prototype/real-estate）の CSS・state.js・editor.js を読み、
    render.js だけ写し（不動産v34.render.js）を使う。変えたのは draw() の窓だけ。

    ■ 決まり（ユーザーと合わせたもの）
      ・間取りに足す記号は窓だけ。部屋の中のドア・設備・収納・階段・柱は、
        この家では事実でないことを言うので入れない
      ・外に面した壁に付ける。屋根の真下の外壁（建物の上端）には付けない
        2列：今のうち＝左3／そのとき＝右2／書類＝右1／
             権利関係＝左1・下1／ローン・契約＝右1・下1／廊下・玄関＝なし
             数が2以上の壁は、内法を等分したそれぞれの中ほど
        1列：各部屋の左右に1つずつ、いちばん下は下にも
      ・形は引違い窓。幅は既製の 1690mm（＝169）、壁が短ければ小窓 780mm
  -->
  <style>
    .pl-win-bg{fill:#FDFCF8}
    .pl-win-f{stroke:#6E6A60;stroke-width:1}
    .pl-win-s{stroke:#6E6A60;stroke-width:1.6}
  </style>
</head>
<!-- data-area がナビの現在地、data-root が prototype/ までの相対パス。
     左のガイドブックは shared/shell.js が下の空の aside へ描く。

     成果物UIの造形は間取り図。7項目が部屋として入る。壁・建具は
     実寸比から引いた SVG（render.js の PLAN）。 -->
<body data-area="real-estate" data-root="../prototype/">
<div class="shell">
  <aside class="guide"></aside>
  <main class="work"><div class="inner">

    <div class="sec-h">
      <span class="sec-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M3.5 11.5 12 4.2l8.5 7.3"/><path d="M5.8 10.8V19a1 1 0 0 0 1 1h10.4a1 1 0 0 0 1-1v-8.2"/><path d="M9.8 20v-5.4a1 1 0 0 1 1-1h2.4a1 1 0 0 1 1 1V20"/></svg></span>
      <h3>持っている不動産</h3><span class="cnt" id="cntShelf"></span>
      <button class="addbtn" id="addProp">＋ 物件を登録</button>
    </div>
    <p class="sec-lead">自宅・実家・土地など、名義や持分に関わる不動産を並べています。</p>
    <div class="sec"><div class="shelf" id="shelf"></div></div>

    <div class="sec"><div id="plans"></div></div>

  </div></main>
</div>
<div class="toast" id="toast"></div>
<script src="../prototype/shared/areas.js"></script>
<script src="../prototype/shared/shell.js"></script>
<script src="../prototype/real-estate/state.js?v=v34"></script>
<script src="../prototype/real-estate/editor.js?v=v34"></script>
<script src="不動産v34.render.js?v=v34"></script>
</body>
</html>
