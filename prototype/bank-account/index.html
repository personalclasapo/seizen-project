<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>SeiZen | 銀行口座を整理する</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../shared/tokens.css">
  <link rel="stylesheet" href="../shared/shell.css">
  <link rel="stylesheet" href="area.css">
</head>
<!-- data-area がナビの現在地、data-root が prototype/ までの相対パス。
     左のガイドブックは shared/shell.js が下の空の aside へ描く。 -->
<body data-area="bank-account" data-root="../">
<div class="shell">
  <aside class="guide"></aside>
  <main class="work"><div class="inner">
    <div class="sec-h">
      <span class="sec-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 6h16M4 12h16M4 18h10"/></svg></span>
      <h3>銀行口座の一覧</h3><span class="cnt" id="cntShelf"></span>
      <button class="addbtn" id="addbank">＋ 銀行口座登録</button>
    </div>
    <p class="sec-lead">どの銀行に何があり、必要な対応が済んでいるかを一目で確認できます。</p>
    <div class="sec">
      <div class="alert" id="alert">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#BE7017" stroke-width="1.8"><path d="M12 4l9 16H3z"/><path d="M12 10v4M12 17h.01"/></svg>
        <div></div>
      </div>
      <!-- 通帳の表紙を並べた目次。押すと下の該当通帳へ送る。 -->
      <div class="shelf" id="shelf"></div>
    </div>
    <div class="sec-h">
      <span class="sec-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M5 4.5h11a2 2 0 0 1 2 2V20H7a2 2 0 0 1-2-2Z"/><path d="M8 4.5V20M8 8.5h6M8 12h4"/></svg></span>
      <h3>銀行口座ごとの記録</h3><span class="cnt" id="cntBooks"></span>
    </div>
    <p class="sec-lead">口座情報・必要な持ち物・いざという時の対応を、銀行ごとにまとめています。</p>
    <div class="sec">
      <!-- 通帳はここに state.js の事実から描かれる。 -->
      <div id="books"></div>
    </div>
  </div></main>
</div>
<div class="toast" id="toast"></div>
<script src="../shared/areas.js"></script>
<script src="../shared/shell.js"></script>
<script src="state.js"></script>
<script src="render.js"></script>
</body>
</html>
