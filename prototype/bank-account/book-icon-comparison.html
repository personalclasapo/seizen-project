<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>SeiZen 本アイコン 3案比較</title>
  <style>
    *{box-sizing:border-box}body{margin:0;background:#f3efe5;color:#283229;font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",sans-serif}.sheet{width:760px;margin:32px auto;padding:28px 34px 32px;border:1px solid #ddd6c7;border-radius:14px;background:#fffdf8;box-shadow:0 10px 28px #584d3620}h1{margin:0;font-size:20px}.note{margin:7px 0 22px;color:#697068;font-size:12px}.options{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}.option{padding:18px 12px;border:1px solid #e2ded2;border-radius:10px;background:#faf9f3;text-align:center}.option h2{margin:0 0 13px;font-size:14px}.actual{display:flex;justify-content:center;align-items:center;height:64px}.actual img{display:block;width:52px;height:52px}.caption{margin:10px 0 0;color:#5f665e;font-size:11px;line-height:1.6}.zoom-label{margin:24px 0 10px;padding-top:18px;border-top:1px solid #e6e1d6;color:#74766f;font-size:11px}.zooms{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}.zoom{display:grid;place-items:center;height:178px;border-radius:10px;background:#f7f8f2}.zoom img{display:block;width:156px;height:156px}
  </style>
</head>
<body>
  <main class="sheet">
    <h1>「なぜ整理するのか」本アイコン 3案</h1>
    <p class="note">上段はサイトと同じ52px実寸。下段は形状確認用の3倍表示です。</p>
    <section class="options">
      <article class="option"><h2>A　開いたノート・正面</h2><div class="actual"><img src="assets/book-option-a.svg" alt="A 開いたノートを正面から見た案"></div><p class="caption">記入する案内ノートとして<br>最も素直な形</p></article>
      <article class="option"><h2>B　厚みのある開いた本</h2><div class="actual"><img src="assets/book-option-b.svg" alt="B 少し斜め上から見た厚みのある本の案"></div><p class="caption">冊子としての存在感と<br>ページの厚みを強調</p></article>
      <article class="option"><h2>C　しおり付き案内冊子</h2><div class="actual"><img src="assets/book-option-c.svg" alt="C しおり付き案内冊子の案"></div><p class="caption">読み返すガイドらしさを<br>控えめなしおりで表現</p></article>
    </section>
    <p class="zoom-label">拡大確認（同じSVG）</p>
    <section class="zooms"><div class="zoom"><img src="assets/book-option-a.svg" alt="Aの拡大"></div><div class="zoom"><img src="assets/book-option-b.svg" alt="Bの拡大"></div><div class="zoom"><img src="assets/book-option-c.svg" alt="Cの拡大"></div></section>
  </main>
</body>
</html>
