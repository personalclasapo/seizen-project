<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>SeiZen | 不動産・住まいを整理する</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../shared/tokens.css">
  <link rel="stylesheet" href="../shared/shell.css">
  <link rel="stylesheet" href="area.css?v=20260922-3">
</head>
<!-- data-area がナビの現在地、data-root が prototype/ までの相対パス。
     左のガイドブックは shared/shell.js が下の空の aside へ描く。

     成果物UIの造形は間取り図。7項目が部屋として入る。壁・建具は
     実寸比から引いた SVG（render.js の PLAN）。 -->
<body data-area="real-estate" data-root="../">
<div class="shell">
  <aside class="guide"></aside>
  <main class="work"><div class="inner">

    <div class="sec-h">
      <span class="sec-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M3.5 11.5 12 4.2l8.5 7.3"/><path d="M5.8 10.8V19a1 1 0 0 0 1 1h10.4a1 1 0 0 0 1-1v-8.2"/><path d="M9.8 20v-5.4a1 1 0 0 1 1-1h2.4a1 1 0 0 1 1 1V20"/></svg></span>
      <h3>持っている不動産</h3><span class="cnt" id="cntShelf"></span>
      <button class="addbtn" id="addProp">＋ 物件を登録</button>
    </div>
    <p class="sec-lead">自宅・実家・土地など、名義や持分に関わる不動産を並べています。</p>
    <div class="sec"><div class="shelf" id="shelf"></div></div>

    <div class="sec-h">
      <span class="sec-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3.5" y="4" width="17" height="16" rx="1.2"/><path d="M3.5 12h17M12 4v8M12 16h8.5"/></svg></span>
      <h3>物件ごとの記録</h3>
    </div>
    <p class="sec-lead">権利・ローン・事情・入る方法を、その家の間取りの上にまとめています。</p>
    <div class="sec"><div id="plans"></div></div>

  </div></main>
</div>
<div class="toast" id="toast"></div>
<script src="../shared/areas.js"></script>
<script src="../shared/shell.js"></script>
<script src="state.js?v=20260922-3"></script>
<script src="render.js?v=20260922-3"></script>
</body>
</html>
