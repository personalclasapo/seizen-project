<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>SeiZen | 保険を整理する</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../shared/tokens.css">
  <link rel="stylesheet" href="../shared/shell.css">
  <link rel="stylesheet" href="area.css">
</head>
<!-- data-area がナビの現在地、data-root が prototype/ までの相対パス。
     左のガイドブックは shared/shell.js が下の空の aside へ描く。 -->
<body data-area="insurance" data-root="../">
<div class="shell">
  <aside class="guide"></aside>
  <main class="work"><div class="inner">

    <div class="sec-h">
      <span class="sec-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M12 3.2 5 6v5.4c0 4.7 2.9 7.6 7 8.8 4.1-1.2 7-4.1 7-8.8V6l-7-2.8Z"/><path d="m9.1 11.7 2 1.9 3.8-4.1"/></svg></span>
      <h3>保険一覧</h3>
      <button class="addbtn" id="addPolicy">＋ 保険を追加する</button>
    </div>
    <p class="sec-lead">加入している保険を一覧で確認できます。詳細を確認・編集したい保険を開いてください。</p>
    <div class="sec">
      <!-- 証券フォルダを並べた目次。押すと下の該当証券へ送る。 -->
      <div class="rack" id="rack"></div>
    </div>

    <div class="sec-h">
      <span class="sec-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M6.5 3h8l4 4v14h-12Z"/><path d="M14.5 3v4h4"/><path d="M9 12h6M9 15.3h6M9 18.6h3.5"/></svg></span>
      <h3>保険ごとの記録</h3><span class="cnt" id="cntDetails"></span>
    </div>
    <p class="sec-lead">契約内容・確認する場面・いざという時の連絡先を、保険ごとにまとめています。</p>
    <div class="sec">
      <!-- 証券はここに state.js の事実から描かれる。 -->
      <div id="policies"></div>
    </div>

  </div></main>
</div>
<div class="toast" id="toast"></div>
<script src="../shared/areas.js"></script>
<script src="../shared/shell.js"></script>
<script src="state.js"></script>
<script src="render.js"></script>
</body>
</html>
