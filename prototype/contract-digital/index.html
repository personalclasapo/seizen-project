<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>SeiZen | 契約・デジタルを整理する</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../shared/tokens.css">
  <link rel="stylesheet" href="../shared/shell.css">
  <link rel="stylesheet" href="area.css">
</head>
<!-- data-area がナビの現在地、data-root が prototype/ までの相対パス。
     左のガイドブックは shared/shell.js が下の空の aside へ描く。 -->
<body data-area="contract-digital" data-root="../">
<div class="shell">
  <aside class="guide"></aside>
  <main class="work"><div class="inner">
    <div id="indexView">
    <div class="sec-h sec-h-lg">
      <span class="sec-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 6h16M4 12h16M4 18h10"/></svg></span>
      <h3>契約・デジタルの一覧</h3><span class="cnt" id="cnt"></span>
      <span class="rt">最終更新日：2024/05/20</span>
    </div>
    <p class="sec-lead">大切な契約やアカウントを、対応のタイミングや支払いのつながりで整理しています。</p>

    <div class="sec">
      <div class="idxgrid" id="idxgrid"></div>

      <div class="sec-h" style="margin-top:38px">
        <span class="sec-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M12 4v16M4 12h16"/></svg></span>
        <h3>サービスの追加</h3>
      </div>

      <p class="addlead">思い当たるサービスから探すか、支払い明細から探せます。</p>
      <div class="addcards">
        <div class="addcard">
          <span class="addcard-ic">
            <svg viewBox="0 0 96 96" role="img" aria-labelledby="aat aad"><title id="aat">一覧と検索</title><desc id="aad">項目の並ぶ書類とチェックマーク、重なる虫眼鏡</desc>
              <circle cx="48" cy="48" r="48" fill="var(--paper2)"/>
              <rect x="24" y="26" width="40" height="46" rx="4" fill="#fff9eb" stroke="#607b62" stroke-width="1.6"/>
              <circle cx="30.5" cy="37" r="2.1" fill="var(--gr)"/><path d="M35.5 37h19" stroke="#9ba795" stroke-width="1.6" stroke-linecap="round"/>
              <circle cx="30.5" cy="45.5" r="2.1" fill="var(--gr)"/><path d="M35.5 45.5h19" stroke="#9ba795" stroke-width="1.6" stroke-linecap="round"/>
              <circle cx="30.5" cy="54" r="2.1" fill="var(--gr)"/><path d="M35.5 54h13" stroke="#9ba795" stroke-width="1.6" stroke-linecap="round"/>
              <circle cx="52" cy="66" r="9" fill="var(--gr)"/><path d="m48 66 2.8 2.8L56.5 63" stroke="#fff" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
              <circle cx="63" cy="55" r="10.5" fill="none" stroke="var(--gr-d)" stroke-width="3"/><path d="m70.8 62.8 5.6 5.6" stroke="var(--gr-d)" stroke-width="3" stroke-linecap="round"/>
            </svg>
          </span>
          <h4>サービスから探す</h4>
          <p>思い当たるサービスを、一覧や検索から選びます。</p>
          <a class="addcard-btn" href="add.html">サービスを探す <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m9 6 6 6-6 6"/></svg></a>
        </div>
        <div class="addcard">
          <span class="addcard-ic">
            <svg viewBox="0 0 96 96" role="img" aria-labelledby="abt abd"><title id="abt">支払い明細</title><desc id="abd">金額の並ぶ明細書と重なるカード</desc>
              <circle cx="48" cy="48" r="48" fill="var(--paper2)"/>
              <rect x="19" y="21" width="40" height="50" rx="4" fill="#fff9eb" stroke="#607b62" stroke-width="1.6"/>
              <path d="M25 30h20" stroke="#607b62" stroke-width="1.8" stroke-linecap="round"/>
              <circle cx="26.3" cy="41" r="2" fill="var(--gr)"/><path d="M31 41h13" stroke="#9ba795" stroke-width="1.6" stroke-linecap="round"/>
              <circle cx="26.3" cy="49.5" r="2" fill="var(--gr)"/><path d="M31 49.5h13" stroke="#9ba795" stroke-width="1.6" stroke-linecap="round"/>
              <circle cx="26.3" cy="58" r="2" fill="var(--gr)"/><path d="M31 58h9" stroke="#9ba795" stroke-width="1.6" stroke-linecap="round"/>
              <rect x="47" y="52" width="34" height="22" rx="3.4" fill="var(--gr)"/><rect x="51.5" y="58.5" width="9" height="6.5" rx="1.2" fill="#e8dfa9"/><path d="M47 68h34" stroke="#3f6b52" stroke-width="1.2"/>
            </svg>
          </span>
          <h4>支払い明細から探す</h4>
          <p>カードや口座の明細から、継続している契約を見つけます。</p>
          <button class="addcard-btn" id="add-ocr">支払い明細から探す <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m9 6 6 6-6 6"/></svg></button>
        </div>
      </div>
      <p class="addnote"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><circle cx="12" cy="12" r="9"/><path d="M12 11v5.5M12 8v.01"/></svg>あとからいつでも追加・変更できます。</p>

    </div>
    </div>

    <!-- 詳細：契約・カード1件の画面。?id= を持つ別画面として遷移する。 -->
    <div id="detailView" hidden>
      <div id="detailNav"></div>
      <div class="dtl-file"><div class="sheet" id="sheet"></div></div>
    </div>
  </div></main>
</div>

<div class="toast" id="toast"></div>
<script src="../shared/areas.js"></script>
<script src="../shared/shell.js"></script>
<script src="catalog.js"></script>
<script src="state.js"></script>
<script src="render.js"></script>
</body>
</html>
