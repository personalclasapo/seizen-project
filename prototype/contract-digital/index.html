<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>SeiZen | 契約・デジタルを整理する</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../shared/tokens.css">
  <link rel="stylesheet" href="../shared/shell.css">
  <link rel="stylesheet" href="area.css">
</head>
<!-- data-area がナビの現在地、data-root が prototype/ までの相対パス。
     左のガイドブックは shared/shell.js が下の空の aside へ描く。 -->
<body data-area="contract-digital" data-root="../">
<div class="shell">
  <aside class="guide"></aside>
  <main class="work"><div class="inner">
    <header class="top"><div class="title"><span class="title-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><rect x="4" y="3" width="11" height="17" rx="1"/><path d="M7 7h5M7 11h5M18 8v8m-3-3 3 3 3-3"/></svg></span><div><h2>契約・デジタル</h2><p>続いている契約と、家族が困らないためのアカウント・データを、同じ記録としてまとめて整理しましょう。</p></div></div></header>

    <section class="why" id="why">
      <div class="why-tx">
        <button class="why-toggle" type="button" id="whyToggle" aria-expanded="true" aria-controls="whyBody">
          <span class="why-ic"><svg viewBox="8 14 36 26" role="img" aria-labelledby="wat wad"><title id="wat">開いたノート</title><desc id="wad">生成りのページと緑の表紙を持つ開いたノート</desc><path d="M10.8 18.6c4.8-2.7 10-2.4 15.2.7 5.2-3.1 10.4-3.4 15.2-.7v19.2c-4.7-2.1-9.8-1.7-15.2 1.2-5.4-2.9-10.5-3.3-15.2-1.2V18.6Z" fill="#4f7558"/><path d="M12.4 16.3c4.3-2.1 8.7-1.6 13.6 1.5v18.8c-4.8-2.6-9.3-3-13.6-1.1V16.3Z" fill="#fff9eb" stroke="#607b62" stroke-width="1.15" stroke-linejoin="round"/><path d="M39.6 16.3c-4.3-2.1-8.7-1.6-13.6 1.5v18.8c4.8-2.6 9.3-3 13.6-1.1V16.3Z" fill="#fff9eb" stroke="#607b62" stroke-width="1.15" stroke-linejoin="round"/><path d="M26 18v18.5M15.6 21.4c2.8-.6 5.2-.2 7.6 1M15.6 25.2c2.8-.5 5.2-.1 7.6 1M36.4 21.4c-2.8-.6-5.2-.2-7.6 1M36.4 25.2c-2.8-.5-5.2-.1-7.6 1" fill="none" stroke="#9ba795" stroke-width=".85" stroke-linecap="round"/></svg></span>
          <h3>なぜ整理するのか</h3>
          <svg class="why-chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m6 9 6 6 6-6"/></svg>
        </button>
        <div class="why-body" id="whyBody">
          <p>契約は、本人が亡くなっても自動では止まりません。引き落としは続き、家族が気づくまで支払いが発生します。<br>
          スマートフォンやメールが開けなければ、何を契約しているかを調べることもできません。<br>
          <b>一部のサービスは、本人が元気なうちにしか家族が使えるようにできません。</b></p>
        </div>
      </div>
    </section>

    <div class="sec-h">
      <span class="sec-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 6h16M4 12h16M4 18h10"/></svg></span>
      <h3>契約・アカウントの一覧</h3><span class="cnt" id="cnt"></span>
      <span class="rt">最終更新日：2024/05/20</span>
    </div>
    <p class="sec-lead">大切な契約やアカウントを、対応のタイミングや支払いのつながりで整理しています。</p>

    <div class="sec">
      <div class="idxgrid" id="idxgrid"></div>

      <div class="sec-h" style="margin-top:38px">
        <span class="sec-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M12 4v16M4 12h16"/></svg></span>
        <h3>サービスの追加</h3>
      </div>

      <div class="addrow2">
        <button class="addbtn" id="add-manual">＋ 直接入力で追加する</button>
        <button class="addbtn ghost" id="add-ocr">明細から取り込む（準備中）</button>
      </div>

    </div>
  </div></main>
</div>

<!-- 詳細：索引の上に重なって開く。索引は背後に残る。 -->
<div class="scrim" id="scrim"><div class="sheet" id="sheet"></div></div>

<div class="toast" id="toast"></div>
<script src="../shared/areas.js"></script>
<script src="../shared/shell.js"></script>
<script src="state.js"></script>
<script src="render.js"></script>
</body>
</html>
